function delTodo(id){
  const t=getTodo(id); if(!t) return;
  if(deleteLocked(t)){ toast("该作业已超过 "+DELETE_LOCK_DAYS+" 天，无法删除；仍可编辑状态、补打卡、改错题、订正"); return; }
  const m = t.masterId ? getMaster(t.masterId) : null;
  if(m){
    // 循环作业单天删除：仅跳过该天，循环继续
    if(!confirm("这是循环作业「"+t.title+"」。\n点【确定】＝只删除 "+t.date+" 这一天（之后仍按循环出现）；\n点【取消】＝不删除。")) return;
    m.skip = m.skip||[]; if(!m.skip.includes(t.date)) m.skip.push(t.date); m._u=Date.now();
  } else {
    if(!confirm("确定删除该作业？")) return;
  }
  tombstone(id);
  state.todos=state.todos.filter(x=>x.id!==id);
  if(openExpo===id) openExpo=null;
  if(ganttHL===id) ganttHL=null;
  save(); renderList(); syncDerived();
  toast("已删除作业");
}
/* ============ 循环锁定（每日 / 每周）============
   母版存于 state.masters；每天查看时按规则惰性生成「实例」写入 state.todos。
   日锁定：每天出现；周锁定：与母版 origin 同一星期几才出现。
   ★ 锁定规则（统一）：「操作日」= 你点击锁定/解锁按钮那一项的日期 ad。
     · 锁定：对 ad 及之后的「每一日」均生效，并加入后续对应清单；ad 之前的清单永远不会被改动。
     · 解锁：对 ad 之后的「每一日」均生效——该项从 ad 之后所有日期的清单中清除
       （无论完成与否，均不再有该项作业内容）；ad 当天仅去掉标记保留，ad 之前不动。
     · 修改内容/预估：仅同步到 ad 之后的实例，不回溯改之前的。
   单击锁定键 = 固定；再次单击同一键 = 取消。
   单天删除 = 仅把该天加入母版 skip，循环照常。 */
function getMaster(id){ return (state.masters||[]).find(m=>m.id===id); }
function parseDS(ds){ const p=ds.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function weekdayOf(ds){ return parseDS(ds).getDay(); }
function ruleMatch(m, ds){
  if(m.lock==="daily") return true;
  if(m.lock==="weekly") return weekdayOf(ds)===weekdayOf(m.origin);
  return false;
}
function genRecurring(ds){
  if(!state.masters || !state.masters.length) return;
  let added=false;
  state.masters.forEach(m=>{
    if(!m.lock) return;                                  // 已解锁不再生成
    if((m.skip||[]).includes(ds)) return;                // 该天被单独跳过（特殊情况）
    if(ds < m.origin) return;                            // 仅固定日（含）之后生成，之前的清单不动
    if(!ruleMatch(m, ds)) return;                        // 不符合日/周规则
    if(state.todos.some(t=>t.masterId===m.id && t.date===ds)) return;  // 已存在
    const t = mkTodo(parseDS(ds), m.subject, m.title, { masterId:m.id, lock:m.lock, estMin:m.estMin||0, detail:m.detail||"" });
    state.todos.push(t); added=true;
  });
  if(added) save();
}
function fmtEst(m){ m=Math.round(m||0); if(m<=0) return "0 分"; if(m<60) return m+" 分"; const h=Math.floor(m/60), mm=m%60; return mm? h+" 时 "+mm+" 分" : h+" 时"; }
function propagateMaster(m, ad){
  // 仅把 标题/内容/预估/循环类型 同步到「锁定日之后、未完成且未计时」的实例（ad 之后）
  state.todos.forEach(x=>{ if(x.masterId===m.id && !x.done && !x.timerRunning && (!ad || x.date>ad)){ x.title=m.title; x.detail=m.detail; x.estMin=m.estMin; x.lock=m.lock; } });
}
function toggleLock(id, type){
  // 单击切换：已固定该类型 → 取消；否则固定为该类型
  const t=getTodo(id); if(!t) return;
  if(t.lock===type) setLock(id, null);
  else setLock(id, type);
}
function setLock(id, type){
  const t=getTodo(id); if(!t) return;
  const ad = t.date;                                 // 「操作日」= 点击该项当天的日期
  let m = t.masterId ? getMaster(t.masterId) : null;
  if(type===null){
    // 解锁：对「操作日之后」的每一日生效——清除该项（含已完成）；操作日当天仅去标记保留，之前不动
    if(m){
      state._delM[m.id]=Date.now();                  // 母版删除墓碑：跨端停止循环
      state.masters = state.masters.filter(x=>x.id!==m.id);
      state.todos = state.todos.filter(x=>{          // ad 之后每一日均清除（无论完成与否），并记墓碑防云端复活
        if(x.masterId===m.id && x.date>ad){ tombstone(x.id); return false; }
        return true;
      });
    }
    t.lock=null; t.masterId=null; touch(t);
    save(); renderList(); syncDerived();
    return;
  }
  // 上锁 / 切换类型
  if(!m){
    m = { id:uid(), subject:t.subject, title:t.title, detail:t.detail||"", estMin:t.estMin||0, lock:type, origin:ad, skip:[], _u:Date.now() };
    state.masters.push(m); t.masterId=m.id; t.lock=type;
  } else {
    m.lock=type; m.subject=t.subject; m.title=t.title; m.detail=t.detail||""; m.estMin=t.estMin||0; m._u=Date.now();
    t.lock=type;
    // 规则变了：删掉「ad 之后」旧规则生成的未完成实例，按新规则惰性重生（查看时生成）
    state.todos = state.todos.filter(x=> !(x.masterId===m.id && !x.done && x.date>ad) );
    propagateMaster(m, ad);                          // 同步内容到 ad 之后的实例
  }
  touch(t); save(); renderList(); syncDerived();
  toast(type==="daily"?"已设为每日锁定（仅对锁定日之后生效）":"已设为每周锁定（仅对锁定日之后生效）");
}

function renameTodo(id){
  const t=getTodo(id); if(!t) return;
  const el=$("todo-"+id); if(!el) return;
  const titleEl=el.querySelector(".todo-title"); if(!titleEl) return;
  const inp=document.createElement("input");
  inp.value=t.title; inp.className="todo-title"; inp.style.font="inherit";
  titleEl.replaceWith(inp); inp.focus(); inp.select();
  let done=false;
  const commit=()=>{ if(done) return; done=true; const v=inp.value.trim(); if(v) editField(id,"title",v); renderList(); };
  inp.addEventListener("blur", commit);
  inp.addEventListener("keydown", e=>{ if(e.key==="Enter") inp.blur(); });
}
function toggleExpo(id){
  const prev = openExpo;
  if(prev && prev!==id){ const pt=getTodo(prev); if(pt && pt.timerRunning){ timerPause(prev); } }
  openExpo = (openExpo===id) ? null : id;
  renderList();
}
function onChk(id){
  const was = getTodo(id).done;
  toggleDone(id);
  if(!was){ const st=$("stamp-"+id); if(st){ st.classList.add("go"); } }
  renderList();
}

/* ===== 作业统计（自适应多段时间轴 + 条目式列表） ===== */
const GAP_SPLIT = 90;   // 相邻作业空隙超过该分钟数，就另起一条时间轴
const MAX_ROWS  = 3;    // 时间轴最多分几段（对应 上午 / 下午 / 晚上）
const GAP_MERGE = 10;   // 同一作业相邻计时段之间，暂停短于该分钟数则合并为一段（只计实际工时）；满 10 分钟以上才拆成两段
/* 色块宽度：末尾减 2px，让相邻色块之间留出细微间隔，便于分清 */
const blkWidth = p => `max(calc(${p}% - 2px), 3px)`;
const LANE_H = 20;        // 每条泳道高度（压低，让时间轴更贴近“一行”）
const BLK_H  = 14;        // 单个色块高度（无文字、短条）
/* 单条作业的真实计时分段（分钟）；相邻段暂停 <GAP_MERGE 合并为一段，
   合并后色块长度=各段实际工时之和（暂停不计入），即“色块只显示实际工作时间” */
function segMins(t){
  const now = Math.floor(Date.now()/60000)%1440;
  const raw=[];
  const segs=(t.segments||[]).filter(x=>x && x.s);
  if(segs.length){
    segs.forEach(x=>{
      const sm=clockToMin(x.s); if(sm==null) return;
      const run = (x.e==null && t.timerRunning);
      let em = x.e!=null ? clockToMin(x.e) : (run ? now : sm);
      if(em==null || em<sm) em = sm + Math.max(Math.round((t.estMin||20)/2),5);
      const e2 = Math.max(em, sm+5);
      raw.push({sm, realEnd:e2, dur:e2-sm, running:run});
    });
  } else {
    // 无分段：只用计时器实际用时；从未计时就不臆造时间条（不再按“完成时间”拉长）
    const dur = Math.round(spentOf(t)/60000);
    if(dur<=0) return [];
    let sm = clockToMin(t.startClock);
    if(sm==null) sm = t.timerRunning ? now : null;
    if(sm==null) return [];
    const e2 = sm + Math.max(dur, 5);
    raw.push({sm, realEnd:e2, dur:e2-sm, running:t.timerRunning});
  }
  raw.sort((a,b)=> a.sm-b.sm || a.realEnd-b.realEnd);
  const out=[];
  raw.forEach(seg=>{
    const last=out[out.length-1];
    if(last && (seg.sm - last.realEnd) <= GAP_MERGE){
      // 短暂停：合并为一段，长度只累加实际工时，暂停空档不计入
      last.dur += seg.dur;
      last.realEnd = Math.max(last.realEnd, seg.realEnd);
      last.em = last.sm + last.dur;
      last.running = last.running || seg.running;
    } else {
      out.push({sm:seg.sm, em:seg.sm+seg.dur, realEnd:seg.realEnd, dur:seg.dur, running:seg.running});
    }
  });
  return out;
}

/* 按时间空隙把当日作业聚成若干段；段内按泳道排布避免色块重叠 */
function buildRows(s){
  const untimed=[], segs=[];
  s.ts.forEach(t=>{
    const m=segMins(t);
    if(!m.length){ if(!t.timerRunning) untimed.push(t); else segs.push({t, sm:clockToMin(t.startClock)||0, em:Math.floor(Date.now()/60000)%1440, running:true, lane:0}); }
    else m.forEach(seg=> segs.push({t, sm:seg.sm, em:seg.em, running:seg.running, lane:0}));
  });
  segs.sort((a,b)=> a.sm-b.sm);

  let clusters=[];
  segs.forEach(it=>{
    const c = clusters[clusters.length-1];
    if(!c) clusters.push({items:[it], minStart:it.sm, maxEnd:it.em, laneEnds:[it.em]});
    else if(it.sm - c.maxEnd > GAP_SPLIT) clusters.push({items:[it], minStart:it.sm, maxEnd:it.em, laneEnds:[it.em]});
    else {
      c.items.push(it); c.minStart=Math.min(c.minStart,it.sm); c.maxEnd=Math.max(c.maxEnd,it.em);
      // 分配泳道：找第一条「末端 ≤ 本段起点」的泳道，放入后更新其末端；否则新增泳道
      let placed=false;
      for(let i=0;i<c.laneEnds.length;i++){ if(c.laneEnds[i] <= it.sm){ it.lane=i; c.laneEnds[i]=it.em; placed=true; break; } }
      if(!placed){ it.lane=c.laneEnds.length; c.laneEnds.push(it.em); }
    }
  });

  // 段数超过上限时，反复合并间隔最小的相邻两段
  while(clusters.length > MAX_ROWS){
    let bi=0, bg=Infinity;
    for(let i=0;i<clusters.length-1;i++){
      const g = clusters[i+1].minStart - clusters[i].maxEnd;
      if(g < bg){ bg=g; bi=i; }
    }
    const a=clusters[bi], b=clusters[bi+1];
    clusters.splice(bi,2,{ items:a.items.concat(b.items),
      minStart:Math.min(a.minStart,b.minStart), maxEnd:Math.max(a.maxEnd,b.maxEnd),
      laneEnds: a.laneEnds.concat(b.laneEnds) });
  }
  clusters.forEach(c=>{ c.lanes = c.laneEnds.length; });   // 该段时间轴需要的泳道数
  return {clusters, untimed};
}
function periodLabel(m){ return m < 12*60 ? "上午" : (m < 18*60 ? "下午" : "晚上"); }
function spanText(m){ const h=Math.floor(m/60), r=m%60;
  return (h? h+" 小时":"") + (h&&r? " ":"") + (r? r+" 分":"") + (!h&&!r? "0 分":""); }
/* 每段基准起点：段首 -15 分后向下取整到 30 分 */
function rowBase(c){ return Math.max(0, Math.floor((c.minStart-15)/30)*30); }
/* 当日统一时长：取覆盖所有段所需长度的最大值，向上取整到 30 分（至少 60 分） */
function commonSpan(clusters){
  let need = 60;
  clusters.forEach(c=>{ need = Math.max(need, Math.min(1440, c.maxEnd+15) - rowBase(c)); });
  return Math.max(60, Math.min(1440, Math.ceil(need/30)*30));
}
/* 各行共用同一 span，只有起点不同 → 同一日每条时间轴代表的时间长度相等 */
function rowRange(c, span){
  let base = rowBase(c);
  if(base + span > 1440) base = Math.max(0, 1440 - span);   // 贴近日终时左移，保证等长
  return {base, end: base+span, span};
}

function renderStats(){
  const ds=ymd(viewDate); const s=dayStats(ds);
  if(s.total===0){ $("statsContent").innerHTML = `<div class="empty-tip">这一天还没有作业记录</div>`; return; }

  // 按开始时间排序（未开始置后）→ 供下方条目列表使用
  const byStart = a => startMinOf(a)==null ? 1e9 : startMinOf(a);
  const sorted = s.ts.slice().sort((a,b)=> byStart(a)-byStart(b));

  const {clusters, untimed} = buildRows(s);
  const legend = SUBJECTS.map(sb=>`<span><i style="background:${SUBJ_COLOR[sb]}"></i>${sb}</span>`).join("");
  const span = commonSpan(clusters);                     // 当日统一时长：各行时间轴等长
  const step = span<=150 ? 30 : (span<=330 ? 60 : 120);  // 刻度步长各行一致

  let html = `<div class="gantt${ganttHL?' has-hl':''}">
    <div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:10px;">今日作业时段${clusters.length>1?`　每段 ${spanText(span)}`:""}</div>`;

  // 各时间段：一段一条时间轴，各行时长相同、仅起点不同
  clusters.forEach(c=>{
    const {base,end}=rowRange(c, span);
    let ticks="";
    for(let m=base; m<=end; m+=step){ const left=((m-base)/span)*100; ticks+=`<span class="tick" style="left:${left}%">${minToClock(m)}</span>`; }
    let blocks="";
    c.items.forEach(it=>{
      const t=it.t;
      const leftP  = Math.min(Math.max(((it.sm-base)/span)*100, 0), 96);
      const widthP = Math.min(Math.max(((it.em-it.sm)/span)*100, 3), 100-leftP);
      const cls = t.done ? "" : (it.running ? "g-run" : "g-none");
      const hl  = ganttHL===t.id ? "hl":"";
      const col = SUBJ_COLOR[t.subject]||"#6B8E5A";
      const top = it.lane*LANE_H + Math.round((LANE_H-BLK_H)/2);
      const tip = esc(t.title) + " · " + t.subject;
      blocks += `<div class="gblock ${cls} ${hl}" style="left:${leftP}%;top:${top}px;height:${BLK_H}px;width:${blkWidth(widthP)};background:${col}" title="${tip}" data-gid="${t.id}" data-sm="${it.sm}" onclick="ganttClick('${t.id}')"></div>`;
    });
    const tag = periodLabel(c.minStart);
    const todoCnt = new Set(c.items.map(i=>i.t.id)).size;
    html += `<div class="gantt-row">
      <div class="grow-hd"><span class="grow-tag ${tag}">${tag}</span><span class="grow-range">${minToClock(base)} – ${minToClock(end)} · ${todoCnt} 项</span></div>
      <div class="gantt-axis">${ticks}</div>
      <div class="gantt-track" data-base="${base}" data-span="${span}" style="height:${Math.max(1,c.lanes)*LANE_H}px">${blocks}</div>
    </div>`;
  });

  // 尚未开始的作业（无时间信息）单独一行，不做时间刻度
  if(untimed.length){
    let blocks="";
    untimed.forEach(t=>{
      const hl  = ganttHL===t.id ? "hl":"";
      const col = SUBJ_COLOR[t.subject]||"#6B8E5A";
      blocks += `<div class="gblock g-none ${hl}" style="background:${col}" title="${esc(t.title)} · ${t.subject}" data-gid="${t.id}" onclick="ganttClick('${t.id}')"></div>`;
    });
    const noTimeTag = untimed.some(t=>t.done) ? "未计时" : "未开始";
    html += `<div class="gantt-row">
      <div class="grow-hd"><span class="grow-tag 未开始">${noTimeTag}</span><span class="grow-range">尚未计时 · ${untimed.length} 项</span></div>
      <div class="gantt-track static">${blocks}</div>
    </div>`;
  }

  html += `<div class="glegend">${legend}</div></div>`;

  // 条目式列表（按时间顺序）
  let rows="";
  sorted.forEach(t=>{
    const isT = isTimed(t);
    const sp = Math.round(recMs(t)/60000);
    const wr = t.wrong||0;
    const hl = ganttHL===t.id ? "hl":"";
    const segs = segmentsOf(t);
    const segStr = segs.length ? segs.map(x=>x.s+"–"+x.e).join(" / ") : "未开始";
    rows += `<div class="srow ${hl}" id="srow-${t.id}" onclick="ganttClick('${t.id}')">
      <div class="srow-top">
        <span class="subj-dot subj-${t.subject}"></span>
        <span class="srow-title">${esc(t.title)}</span>
        <span class="srow-est">预估 ${t.estMin||'-'} 分</span>
      </div>
      <div class="srow-sub">
        <span>起止 <b>${segStr}</b></span>
        <span>用时 <b style="${isT?'':`color:var(--muted);font-weight:600;`}">${isT? sp+" 分" : "未计时"}</b></span>
        <span>错题 <b style="color:${wr>=5?RED:'var(--ink)'}">${wr}</b></span>
        ${ wr>0 ? `<span>订正 <b style="color:${t.corrected?'var(--green)':'var(--sun)'}">${t.corrected?'已订正':'待订正'}</b></span>` : "" }
      </div>
    </div>`;
  });
  html += `<div class="card${ganttHL?' has-hl':''}" style="padding:10px 12px;"><div style="font-size:14px;font-weight:800;color:var(--ink);margin-bottom:4px;">当日作业（按时间）</div>${rows}</div>`;

  // 本日汇总：已移除（与清单栏顶部统计栏重复）

  $("statsContent").innerHTML = html;
  if(ganttHL){ const el=$("srow-"+ganttHL); if(el && el.scrollIntoView) el.scrollIntoView({block:"center",behavior:"smooth"}); }
}
function ganttClick(id){
  ganttHL = (ganttHL===id)? null : id;
  renderStats();
}

/* ===== 待办事项渲染 ===== */
function dueLabel(due){
  if(!due) return {txt:"无截止", over:false};
  const d=parseYmd(due); const today=new Date(); today.setHours(0,0,0,0);
  const over = d < today;
  return { txt:(d.getMonth()+1)+"月"+d.getDate()+"日", over };
}
function renderTasks(){
  const tasks = state.tasks;
  const active = tasks.filter(t=>!t.done).sort((a,b)=> (a.priority-b.priority) || (a.createdAt-b.createdAt));
  const done  = tasks.filter(t=>t.done).sort((a,b)=> (b.doneAt||0)-(a.doneAt||0)).slice(0, TASK_KEEP);

  // 添加卡
  const priBtns=[1,2,3].map(p=>`<button data-p="${p}" class="${addPri===p?'on':''}" onclick="pickAddPri(${p})">${PRI[p].label}</button>`).join("");
  const dueB = addDue? `<span class="due-btn set" onclick="openDuePicker(null)">📅 ${dueLabel(addDue).txt} · 改</span>`
                      : `<span class="due-btn" onclick="openDuePicker(null)">📅 设置截止（可选）</span>`;
  let html = `<div class="task-add">
    <div class="add-title"><span class="subj-dot subj-其他"></span>添加待办</div>
    <div class="seg3">${priBtns}</div>
    ${dueB}
    <div class="add-row">
      <input id="taskInput" placeholder="输入待办内容…" />
      <button class="plus" onclick="commitTask()">+</button>
    </div>
  </div>`;

  // 未完成
  html += `<div class="task-sec">未完成 · ${active.length}</div>`;
  if(active.length===0) html += `<div class="empty-tip">暂无未完成待办</div>`;
  else html += active.map(t=>taskRow(t)).join("");

  // 已完成
  html += `<div class="task-sec">已完成 · ${done.length}${tasks.filter(t=>t.done).length>TASK_KEEP?`（仅保留最新 ${TASK_KEEP} 条）`:""}</div>`;
  if(done.length===0) html += `<div class="empty-tip">还没有已完成的待办</div>`;
  else html += done.map(t=>taskRow(t)).join("");

  $("tasksContent").innerHTML = html;
  const inp=$("taskInput"); if(inp) inp.onkeydown=e=>{ if(e.key==="Enter") commitTask(); };
}
function taskRow(t){
  const p=PRI[t.priority]||PRI[2];
  const dl=dueLabel(t.due);
  const dueHtml = t.due? `<span class="task-due ${dl.over&&!t.done?'over':''}" onclick="openDuePicker('${t.id}')">截止 ${dl.txt}${dl.over&&!t.done?' · 已逾期':''}</span>`
                      : `<span class="task-due" onclick="openDuePicker('${t.id}')">无截止</span>`;
  const delBtn = t.done? "" : `<button class="task-del" onclick="delTask('${t.id}')" aria-label="删除"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 7h14M10 7V5h4v2M6 7l1 12h10l1-12" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`;
  return `<div class="task-row ${t.done?'done':''}">
    <button class="chk ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${chkSvg(t.done)}</button>
    <div class="task-main">
      <div class="task-title">${esc(t.title)}</div>
      <div class="task-meta">
        <span class="pri ${p.cls}" onclick="cyclePri('${t.id}')"><span class="dot"></span>${p.label}</span>
        ${dueHtml}
      </div>
    </div>
    ${delBtn}
  </div>`;
}
function pickAddPri(p){ addPri=p; renderTasks(); }
function commitTask(){ const v=$("taskInput").value; if(!v||!v.trim()){ toast("请输入内容"); return; } addTask(v, addDue, addPri); addDue=null; addPri=2; }
function cyclePri(id){ const t=getTask(id); if(!t) return; setTaskPri(id, t.priority>=3?1:t.priority+1); }
function openDuePicker(id, oy, om){
  const t = id? getTask(id): null;
  // 传入 y,m 时用其定位月份（new Date 自动处理 m<0 / m>11 的跨年溢出）
  const base = (oy!=null && om!=null) ? new Date(oy, om, 1)
             : ((t && t.due) ? parseYmd(t.due) : new Date());
  const y=base.getFullYear(), m=base.getMonth();
  const first=new Date(y,m,1), startDow=first.getDay(); const days=new Date(y,m+1,0).getDate();
  let cells=""; WEEK.forEach(w=>cells+=`<div class="dp-dow">${w[1]}</div>`);
  for(let i=0;i<startDow;i++) cells+=`<div class="dp-cell empty"></div>`;
  const sel= t&&t.due? t.due : (id?null:addDue);
  for(let d=1; d<=days; d++){ const dt=new Date(y,m,d); const sd=ymd(dt); const tdy=sameDay(dt,new Date());
    cells+=`<div class="dp-cell ${sel===sd?'sel':''} ${tdy?'today':''}" onclick="pickDue('${id||''}',${y},${m},${d})">${d}</div>`; }
  const cls = id? "setTaskDue": "setAddDue";
  let html=`<div class="sheet-h">设置截止时间<span class="close" onclick="closeSheet()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></span></div>
    <div class="dp-nav"><button class="nav" onclick="dueMonth('${id||''}',${y},${m-1})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span style="font-weight:700;color:var(--ink);">${y}年${m+1}月</span><button class="nav" onclick="dueMonth('${id||''}',${y},${m+1})"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
    <div class="dp-grid">${cells}</div>
    <div class="opt" style="margin-top:14px;justify-content:center;background:var(--ink);color:#fff;" onclick="${cls}('${id||''}',null)">${id?'清除截止时间':'不设置截止'}</div>`;
  openSheet(html);
}
function dueMonth(id,y,m){ openDuePicker(id||null, y, m); }
function pickDue(id,y,m,d){ const ds=ymd(new Date(y,m,d)); if(id) setTaskDue(id, ds); else { addDue=ds; renderTasks(); } closeSheet(); }
function setAddDue(id, ds){ addDue = ds; renderTasks(); closeSheet(); }
function setTaskDue(id, ds){ const t=getTask(id); if(!t) return; t.due=ds; save(); renderTasks(); closeSheet(); }

/* ============ 比较栏（按小项合并统计 + 日历选时间：全年/全月/周） ============ */
let sumRange = "week";                 // year | month | week
let sumYear = (new Date()).getFullYear();                       // 全年模式年份
let sumMonth = new Date();             // 全月模式导航（仅年月）
let sumWeekStart = (function(){ const t=new Date(); t.setHours(0,0,0,0); const d=new Date(t); d.setDate(t.getDate()-t.getDay()); return ymd(d); })(); // 周模式所选周日(ymd)
let sumCalCollapsed = false;          // 日历卡是否折叠
let sumSort = {key:null, dir:1};       // 比较栏排序：key∈doneN|undoneN|avgMin|avgWrong；dir 1升序/-1降序；null=默认(语数英其他+完成率)

const SUBJ_ORDER = {"语文":0,"数学":1,"英语":2,"其他":3};
function subjIdx(s){ return SUBJ_ORDER.hasOwnProperty(s) ? SUBJ_ORDER[s] : 99; }

function sumRangeDays(){
  const today=new Date(); today.setHours(0,0,0,0);
  const out=[];
  if(sumRange==="year"){
    const y=sumYear;
    const end=new Date(y,11,31); if(end>today) end.setTime(today.getTime());
    for(let d=new Date(y,0,1); d<=end; d.setDate(d.getDate()+1)) out.push(ymd(d));
  } else if(sumRange==="month"){
    const y=sumMonth.getFullYear(), m=sumMonth.getMonth();
    const end=new Date(y,m+1,0); if(end>today) end.setTime(today.getTime());
    for(let d=new Date(y,m,1); d<=end; d.setDate(d.getDate()+1)) out.push(ymd(d));
  } else { // week（周日~周六）
    const ws=parseDS(sumWeekStart);
    const sat=new Date(ws); sat.setDate(ws.getDate()+6);
    for(let d=new Date(ws); d<=sat; d.setDate(d.getDate()+1)){ if(d>today) break; out.push(ymd(d)); }
  }
  return out;
}

function sumNavLabel(){
  if(sumRange==="year") return sumYear+"年";
  if(sumRange==="month") return sumMonth.getFullYear()+"年"+(sumMonth.getMonth()+1)+"月";
  const ws=parseDS(sumWeekStart), sat=new Date(ws); sat.setDate(ws.getDate()+6);
  return (ws.getMonth()+1)+"/"+ws.getDate()+"–"+(sat.getMonth()+1)+"/"+sat.getDate()+" 周";
}
function calToggleLabel(){
  if(sumRange==="year") return sumYear+"年 · 全年统计";
  if(sumRange==="month") return sumMonth.getFullYear()+"年"+(sumMonth.getMonth()+1)+"月 · 全月统计";
  const ws=parseDS(sumWeekStart), sat=new Date(ws); sat.setDate(ws.getDate()+6);
  const today=new Date(); today.setHours(0,0,0,0); const ed=sat>today?today:sat;
  return "所选周："+(ws.getMonth()+1)+"月"+ws.getDate()+"日 – "+(ed.getMonth()+1)+"月"+ed.getDate()+"日（周）";
}
function toggleSumCal(){ sumCalCollapsed=!sumCalCollapsed; renderSummary(); }

function renderSumCal(){
  const wrap=$("sumCalWrap");
  const today=new Date(); today.setHours(0,0,0,0);
  // 折叠切换条（始终显示）
  let html = `<div class="cal-toggle" onclick="toggleSumCal()"><span class="t">${calToggleLabel()}</span><span class="caret">${sumCalCollapsed?"▸":"▾"}</span></div>`;
  if(sumCalCollapsed){
    wrap.innerHTML = html + `<div class="sum-hint">点击上方条展开日历</div>`;
    return;
  }
  if(sumRange==="year"){
    const y=sumYear; const end=new Date(y,11,31); if(end>today) end.setTime(today.getTime());
    const n=Math.round((end-new Date(y,0,1))/86400000)+1;
    wrap.innerHTML = html + `<div class="sum-year-note">统计 ${y} 年全年 · 共 ${n} 天（截止今天）</div>`;
    return;
  }
  if(sumRange==="month"){
    const y=sumMonth.getFullYear(), m=sumMonth.getMonth();
    const end=new Date(y,m+1,0); if(end>today) end.setTime(today.getTime());
    const n=Math.round((end-new Date(y,m,1))/86400000)+1;
    wrap.innerHTML = html + `<div class="sum-year-note">统计 ${y}年${m+1}月 · 共 ${n} 天（截止今天）</div>`;
    return;
  }
  // week：单行显示所选周（周日~周六，与表头 日一二三四五六 对齐）
  const sun=parseDS(sumWeekStart);
  html+=`<div class="cal cal-week"><div class="cal-grid">`;
  WEEK.forEach(w=> html+=`<div class="cal-dow">${w[1]}</div>`);
  for(let i=0;i<7;i++){
    const dt=new Date(sun); dt.setDate(sun.getDate()+i);
    const d=dt.getDate(), ds=ymd(dt);
    const isToday=sameDay(dt,today);
    const isFuture=dt>today;
    let bg="", cls="cal-cell"+(isFuture?" future":" wkpick")+(isToday?" today":"");
    if(!isFuture){ const st=dayStars(ds); if(st.allDone) bg=' style="background:#eaf5ee;"'; else if(st.total>0) bg=' style="background:#fdf3e3;"'; }
    const click = isFuture ? "" : ` onclick="pickSumDay(${dt.getFullYear()},${dt.getMonth()},${d})"`;
    html+=`<div class="${cls}"${click}${bg}><div>${d}</div></div>`;
  }
  html+=`</div></div>`;
  html += `<div class="sum-hint">点选日期切换统计所在周</div>`;
  wrap.innerHTML=html;
}

function renderSummary(){
  if($("sumYearBtn")) $("sumYearBtn").classList.toggle("on", sumRange==="year");
  if($("sumMonthBtn")) $("sumMonthBtn").classList.toggle("on", sumRange==="month");
  if($("sumWeekBtn")) $("sumWeekBtn").classList.toggle("on", sumRange==="week");
  if($("sumNavLabel")) $("sumNavLabel").textContent = sumNavLabel();
  renderSumCal();

  const today=new Date(); today.setHours(0,0,0,0);
  const days = sumRangeDays();
  let label;
  if(sumRange==="year") label = sumYear+"年全年";
  else if(sumRange==="month") label = sumMonth.getFullYear()+"年"+(sumMonth.getMonth()+1)+"月";
  else { const ws=parseDS(sumWeekStart), sat=new Date(ws); sat.setDate(ws.getDate()+6); const ed = sat>today? today: sat;
         label = `${ws.getFullYear()}年${ws.getMonth()+1}月${ws.getDate()}日 ~ ${ed.getFullYear()}年${ed.getMonth()+1}月${ed.getDate()}日（周）`; }

  // 收集范围内的所有作业实例，按「小项」合并（同 科目+名称 视为同一项，跨母版/一次性合并统计）
  const groups = {};
  days.forEach(ds=>{
    todosOf(ds).forEach(t=>{
      const key = (t.subject||"其他")+"||"+(t.title||"(未命名)");
      let g = groups[key];
      if(!g){ g = groups[key] = { subject:t.subject||"其他", title:t.title||"(未命名)", items:[] }; }
      g.items.push(t);
    });
  });
  const keys = Object.keys(groups);
  if(!keys.length){ $("summaryContent").innerHTML = `<div class="empty-tip">${label}还没有作业记录</div>`; return; }

  // 统计每个小项
  const rows = keys.map(key=>{
    const g = groups[key]; const items = g.items;
    const total = items.length;
    const doneN = items.filter(t=>t.done).length;
    const undoneN = total - doneN;
    const rate = total ? Math.round(doneN/total*100) : 0;
    const timed = items.filter(isTimed);                                   // 仅在真正计时过的实例上取平均用时
    const avgMin = timed.length ? Math.round(timed.reduce((s,t)=>s+recMs(t)/60000,0)/timed.length) : null;
    const dones = items.filter(t=>t.done);
    const avgWrong = dones.length ? dones.reduce((s,t)=>s+(t.wrong||0),0)/dones.length : null;  // 平均错误按已完成实例取
    return { key, subject:g.subject, title:g.title, total, doneN, undoneN, rate, avgMin, avgWrong };
  });
  // 排序
  if(sumSort.key){
    const k=sumSort.key, dir=sumSort.dir;
    rows.sort((a,b)=>{
      const av=a[k], bv=b[k], an=av==null, bn=bv==null;
      if(an && bn) return a.title.localeCompare(b.title,"zh");
      if(an) return 1;          // 无数据项始终排最后
      if(bn) return -1;
      if(av!==bv) return (av-bv)*dir;
      return a.title.localeCompare(b.title,"zh");
    });
  } else {
    // 默认：先按 语→数→英→其他，再按完成率从低到高（问题项在前）
    rows.sort((a,b)=> (subjIdx(a.subject)-subjIdx(b.subject)) || (a.rate-b.rate) || a.title.localeCompare(b.title,"zh"));
  }

  const allTotal = rows.reduce((s,r)=>s+r.total,0);
  const allDone = rows.reduce((s,r)=>s+r.doneN,0);
  const allRate = allTotal ? Math.round(allDone/allTotal*100) : 0;

  const SORT_LABEL = {"doneN":"完成次数","undoneN":"未完成次数","avgMin":"平均用时","avgWrong":"平均错误"};
  const sortTip = sumSort.key ? `按 ${SORT_LABEL[sumSort.key]}${sumSort.dir>0?"升序":"降序"}（点表头切换）` : "点表头可排序";

  let html = `<div class="rate-big"><div class="rt">${allRate}%</div><div class="rl">${label} · 整体完成率</div><div class="rsub">共 ${rows.length} 项作业 · 安排 ${allTotal} 次 · 完成 ${allDone} 次 · 未完成 ${allTotal-allDone} 次</div></div>`;
  html += `<div class="cmpt"><div class="cmpt-head"><span>每小项作业一览</span><span class="cnt">${sortTip}</span></div>`;
  // 可点击排序的表头（与下方四格对齐）
  const cols=[["doneN","完成次数"],["undoneN","未完"],["avgMin","平均用时"],["avgWrong","平均错误"]];
  let ch="";
  cols.forEach(([k,lab])=>{
    const on = sumSort.key===k;
    const ar = on ? (sumSort.dir>0?"▲":"▼") : "";
    ch += `<div class="ch${on?" on":""}" onclick="setSumSort('${k}')">${lab}<span class="ar">${ar}</span></div>`;
  });
  html += `<div class="cmpt-colhead"><span class="lh">科目 / 名称</span><div class="hg">${ch}</div></div>`;
  rows.forEach(r=>{
    const col = SUBJ_COLOR[r.subject] || "#6B8E5A";
    const minTxt = r.avgMin==null ? "—" : (r.avgMin<1 ? "<1" : r.avgMin);
    const minUnit = r.avgMin==null ? "" : "<i>分</i>";
    const wrongTxt = r.avgWrong==null ? "—" : (r.avgWrong>=10 ? Math.round(r.avgWrong) : r.avgWrong.toFixed(1));
    const wrongUnit = r.avgWrong==null ? "" : "<i>道</i>";
    html += `<div class="cmpt-row" style="background:${col}4d">
      <div class="top"><span class="sb" style="color:${col};border-color:${col}">${esc(r.subject)}</span><span class="tt" title="${esc(r.title)}">${esc(r.title)}</span></div>
      <div class="stats">
        <div class="stat"><div class="v" style="color:var(--green)">${r.doneN}</div></div>
        <div class="stat"><div class="v" style="color:var(--red)">${r.undoneN}</div></div>
        <div class="stat"><div class="v">${minTxt}${minUnit}</div></div>
        <div class="stat"><div class="v">${wrongTxt}${wrongUnit}</div></div>
      </div>
    </div>`;
  });
  html += `</div>`;
  $("summaryContent").innerHTML = html;
}
function setSumSort(k){
  if(sumSort.key===k){ sumSort.dir = -sumSort.dir; }   // 再次点击同列 → 切换升/降序
  else { sumSort.key = k; sumSort.dir = 1; }            // 新列 → 升序

}

/* ===== 月度统计 ===== */
function renderMonth(){
  const y=monthView.getFullYear(), m=monthView.getMonth();
  $("monthLabel").textContent = y+"年"+(m+1)+"月";
  const first=new Date(y,m,1), startDow=first.getDay();
  const days=new Date(y,m+1,0).getDate();
  // KPI（基于当前月已过的日期）
  let stars=0, full=0, hours=0, unfinished=0, uncorr=0;
  const today=new Date(); today.setHours(0,0,0,0);
  // 汇总全月（仅统计今日以前的日期，不含今日）
  for(let d=1; d<=days; d++){
    const dt=new Date(y,m,d); if(dt>=today) continue;   // 不含今日：今日数据仍在变动，不计入月度统计
    const ds=ymd(dt); const st=dayStars(ds); const s=dayStats(ds);
    stars += st.stars; if(st.allDone) full++; hours += s.totalMin/60;
    // 口径与作业清单严格一致：当月未完成 = 待完成（仅 !done）；当月未订正 = 待订正（有错题未订正）
    s.ts.forEach(t=>{
      if(!t.done) unfinished++;                                       // 待完成：与清单一致（不含已完成的未订正）
      if((t.wrong||0)>0 && !t.corrected) uncorr++;                    // 待订正：与清单一致（不论是否完成）
    });
  }
  let kpi = `<div class="kpi">
    <div class="kpi-cell"><div class="v g">${stars}</div><div class="k">本月星星</div></div>
    <div class="kpi-cell"><div class="v g">${full}</div><div class="k">全勤天数</div></div>
    <div class="kpi-cell"><div class="v warn">${unfinished}</div><div class="k">当月未完成</div></div>
    <div class="kpi-cell"><div class="v warn">${uncorr}</div><div class="k">当月未订正</div></div>
    <div class="kpi-cell"><div class="v g">${hours.toFixed(1)}</div><div class="k">总用时(时)</div></div>
  </div>`;

  let grid = `<div class="cal"><div class="cal-grid">`;
  WEEK.forEach(w=> grid+=`<div class="cal-dow">${w[1]}</div>`);
  for(let i=0;i<startDow;i++) grid+=`<div class="cal-cell empty"></div>`;
  for(let d=1; d<=days; d++){
    const dt=new Date(y,m,d); const ds=ymd(dt); const st=dayStars(ds);
    const isToday = sameDay(dt, today);
    const starTxt = st.stars>0 ? "★".repeat(st.stars) : (st.pending ? '<span class="s0">待</span>' : '<span class="s0">·</span>');
    grid += `<div class="cal-cell ${isToday?'today':''}" onclick="gotoDate(${y},${m},${d})"><div>${d}</div><div class="stars">${starTxt}</div></div>`;
  }
  grid += `</div><div class="legend-row">
    <span><i style="background:var(--sun)"></i>当日全完成 1 星</span>
    <span><i style="background:var(--green)"></i>错题≤5 +1</span>
    <span><i style="background:var(--ink)"></i>21:00 前 +1</span>
    <span><i style="background:var(--muted)"></i>补打卡不计星</span>
  </div>
  <div class="month-note">月度合格标准：未完成项目个数 ≤ 10 项</div></div>`;

  $("monthContent").innerHTML = kpi + grid;
}

/* ============ 云同步：GitHub Gist ============
   数据整体存为一个私密 Gist 文件 hwdsk.json。
   Token 与 Gist ID 存在独立 localStorage 键，不写入 state，因此永不上传。 */
const SYNC_KEY   = "hwdsk_sync_v1";
const SYNC_FILE  = "hwdsk.json";
let syncReady    = false;   // 初始化完成前不触发自动上传
let syncPushT    = null;
const SYNC_DEBOUNCE_MS = 15000;   // 本地改动后静默 15 秒再上传（合并连击，杜绝刷屏式同步）
const SYNC_INTERVAL_MS = 300000;  // 后台自动拉取周期 5 分钟（只拉取合并，不写云端，降低多端写竞争）
let editingId    = null;          // 正在编辑的条目：同步时不被远端覆盖，避免打字被打断

/* ============ 账号系统（本地登录 + 自动云端同步）============
   无后端：账号存本机 localStorage；所有账号共用 MASTER_TOKEN 向各自私密 Gist 同步。
   登录即把该账号的 Token+Gist 写入 SYNC_KEY，复用下方合并式同步，无需手动填云端配置。 */
const TOKEN_KEY = "wb_hwdsk_token_v1";
let MASTER_TOKEN = (function(){ try{ return localStorage.getItem(TOKEN_KEY)||""; }catch(e){ return ""; } })();
const LVCHENG_GIST = "c7160b8d4af6819ee036789e26fa02d0";
const ACCOUNTS_KEY = "wb_hwdsk_accounts_v1";
const SESSION_KEY  = "wb_hwdsk_session_v1";

function hashPW(pw, salt){
  let h=2166136261>>>0; const s=salt+pw;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(16);
}
function loadAccounts(){ try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY))||{}; }catch(e){ return {}; } }
function saveAccounts(a){ try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); }catch(e){} }
function seedAccounts(){
  const a=loadAccounts();
  if(!a.lvcheng){
    const salt="lc"+Math.floor(Math.random()*1e6);
    a.lvcheng={ ph:hashPW("000000",salt), salt:salt, gist:LVCHENG_GIST };
    saveAccounts(a);
  }
  return a;
}
async function apiCreateGist(token){
  const r=await fetch("https://api.github.com/gists",{
    method:"POST",
    headers:{ "Authorization":"token "+(token||MASTER_TOKEN), "Accept":"application/vnd.github+json", "Content-Type":"application/json" },
    body:JSON.stringify({ description:"作业台 用户云端数据", public:false, files:{ [SYNC_FILE]:{ content:"{}" } } })
  });
  if(!r.ok) throw { status:r.status };
  const j=await r.json(); return j.id;
}
async function registerAccount(user, pw){
  user=(user||"").trim(); pw=(pw||"");
  if(!user) throw { msg:"请输入账号名" };
  if(pw.length<4) throw { msg:"密码至少 4 位" };
  const a=loadAccounts();
  if(a[user]) throw { msg:"该账号已存在" };
  const gist=await apiCreateGist(MASTER_TOKEN);
  const salt="u"+Math.floor(Math.random()*1e6);
  a[user]={ ph:hashPW(pw,salt), salt:salt, gist:gist };
  saveAccounts(a);
  return user;
}
function loginAs(user){
  const a=loadAccounts(); const acc=a[user];
  if(!acc) return false;
  localStorage.setItem(SESSION_KEY, user);
  localStorage.setItem(SYNC_KEY, JSON.stringify({ token:MASTER_TOKEN, gist:acc.gist }));
  return true;
}
function currentUser(){ return localStorage.getItem(SESSION_KEY)||""; }
function logout(){
  localStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SYNC_KEY);
}

/* 下拉刷新：在页面顶部下拉触发自动同步 */
let _pull=null;
function bindPull(){
  if(_pull) return; _pull=1;
  const hint=$("pullHint");
  document.querySelectorAll(".page").forEach(p=>{
    let startY=0, pulling=false, y=0;
    p.addEventListener("touchstart", e=>{ if(p.scrollTop<=0){ startY=e.touches[0].clientY; pulling=true; } }, {passive:true});
    p.addEventListener("touchmove", e=>{
      if(!pulling) return;
      const dy=e.touches[0].clientY-startY;
      if(dy>0 && p.scrollTop<=0){
        if(e.cancelable) e.preventDefault();
        y=Math.min(dy*0.5, 80);
        if(hint){ hint.style.height="32px"; hint.textContent = y>55 ? "松开立即同步" : "↓ 下拉刷新"; }
      } else { pulling=false; if(hint){ hint.style.height="0"; } }
    }, {passive:false});
    p.addEventListener("touchend", ()=>{
      if(pulling && y>55){ hint.textContent="正在同步…"; syncCycle(true); setTimeout(()=>{ if(hint) hint.style.height="0"; }, 700); }
      else if(hint){ hint.style.height="0"; }
      pulling=false; y=0;
    });
  });
}

function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }catch(e){ return {}; } }
function syncEnabled(){ const c=syncCfg(); return !!(c.token && c.gist); }

function syncStatus(msg, type){
  const el=$("syncStatus"); if(!el) return;
  el.textContent=msg||""; el.className="sync-status"+(type?" "+type:"");
}
function syncErr(e){
  const s = e && e.status;
  if(s===401) return "Token 无效或已过期";
  if(s===404) return "Gist 未找到，检查 Gist ID";
  if(s===403) return "请求被拒绝（可能触发限流）";
  if(s===-2)  return "云端缺少 "+SYNC_FILE+" 文件";
  if(s===-3)  return "云端数据格式不正确";
  if(s===-4)  return "云端暂无有效数据";
  return "网络异常，请检查联网";
}
function syncHeaders(cfg){
  return { "Authorization":"token "+cfg.token, "Accept":"application/vnd.github+json" };
}
/* 保存用户填写的 Token / Gist ID（只存本机） */
function syncSaveCfg(){
  const t=($("syncToken").value||"").trim();
  let g=($("syncGist").value||"").trim();
  g = g.replace(/^.*gist\.github\.com\/[^\/]+\//,"").replace(/\/.*$/,"").trim();  // 允许直接粘贴完整网址
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify({token:t, gist:g})); }catch(e){}
  if(t && g){
    syncStatus("配置已保存到本机","ok"); toast("配置已保存，正在连接…");
    syncCycle(true);     // 立即合并一次（云端有数据则合并，云端为空则上传本机）
  }else{
    syncStatus("请填写完整的 Token 与 Gist ID","err"); toast("请填写完整的 Token 与 Gist ID");
  }
}
/* 从云端下载。mode="auto"：仅在云端不比本机旧时覆盖，且不弹 toast；其他值：强制覆盖并提示 */
async function syncPull(mode){
  const cfg=syncCfg();
  if(!cfg.token || !cfg.gist){
    if(mode!=="auto"){ syncStatus("请先填写 Token 与 Gist ID","err"); toast("请先填写 Token 与 Gist ID"); }
    return false;
  }
  if(mode!=="auto") syncStatus("正在从云端下载…");
  try{
    const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), { headers: syncHeaders(cfg) });
    if(!r.ok) throw { status:r.status };
    const j = await r.json();
    const f = j && j.files && j.files[SYNC_FILE];
    if(!f) throw { status:-2 };
    const data = JSON.parse(f.content);
    if(!data || typeof data!=="object") throw { status:-3 };

    /* ---- 覆盖决策：安全优先，绝不让“空”的云端吞掉本机真实数据 ---- */
    const cTodos    = Array.isArray(data.todos) ? data.todos : [];
    const cloudN    = cTodos.length;                                  // 云端总条数
    const cloudAt   = data._syncedAt || 0;
    const lTodos    = (state.todos||[]);
    const localN    = lTodos.length;
    const localAt   = state._syncedAt || 0;

    if(mode==="auto"){
      if(cloudN===0){ syncStatus("云端暂无数据，保留本机"); return false; }          // → 随后上传本机
      if(localN>0 && cloudAt<=localAt){ syncStatus("本机数据已是最新"); return true; }
      // 其余情况（云端明显更新）→ 采用云端
    }else{
      // 手动下载会覆盖本机，先二次确认
      if(localN>0){
        const tip = cloudN===0
          ? "云端暂无作业数据，继续下载会清空本机的 "+localN+" 条作业。确定吗？"
          : "从云端下载会用云端的 "+cloudN+" 条作业覆盖本机的 "+localN+" 条。确定吗？";
        if(!confirm(tip)){ syncStatus("已取消下载"); return false; }
      }
    }

    state = data; state._syncedAt = cloudAt;
    if(!Array.isArray(state.todos)) state.todos = [];
    if(!state.tasks)    state.tasks    = [];
    if(!Array.isArray(state.masters)) state.masters = [];
    if(!state._delM) state._delM = {};
    if(!state.hw) state.hw = {};                 // 常用词：随作业清单一起同步
    if(!state._delHW) state._delHW = {};         // 常用词删除墓碑
    state.masters = state.masters.filter(m=>m && !((state._delM||{})[m.id]));   // 应用母版删除墓碑
    saveLocal(); refreshAll(); renderTasks();
    const n = (state.todos||[]).length;
    syncStatus("已同步云端 "+n+" 条作业","ok");
    if(mode!=="auto") toast("已下载云端数据 "+n+" 条");
    return true;
  }catch(e){
    const msg = syncErr(e);
    syncStatus("下载失败："+msg,"err");
    if(mode!=="auto") toast("下载失败："+msg);
    return false;
  }
}
/* 把本机数据整体上传到云端 */
async function syncPush(silent){
  const cfg=syncCfg();
  if(!cfg.token || !cfg.gist){
    if(!silent){ syncStatus("请先填写 Token 与 Gist ID","err"); toast("请先填写 Token 与 Gist ID"); }
    return false;
  }
  if(!silent) syncStatus("正在上传到云端…");
  try{
    state._syncedAt = Date.now();
    const up = JSON.parse(JSON.stringify(state));
    const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), {
      method:"PATCH",
      headers: Object.assign(syncHeaders(cfg), { "Content-Type":"application/json" }),
      body: JSON.stringify({ files:{ [SYNC_FILE]:{ content: JSON.stringify(up) } } })
    });
    if(!r.ok) throw { status:r.status };
    saveLocal();
    const d=new Date();
    syncStatus("已上传 · "+pad2(d.getHours())+":"+pad2(d.getMinutes()),"ok");
    if(!silent) toast("已上传到云端");
    return true;
  }catch(e){
    const msg = syncErr(e);
    syncStatus("上传失败："+msg,"err");
    if(!silent) toast("上传失败："+msg);
    return false;
  }
}
/* ============ 自动同步核心 ============
   每次同步 =「取云端 → 与本机逐条合并 → 写回云端」。
   同一条数据以「最后修改时间 _u」较新的一方为准，删除走墓碑，
   因此任何一端的新数据都不会被另一端的旧数据覆盖。 */
let syncBusy = false;

/* 按 id 合并两组条目：同 id 取 _u 更大的一方；墓碑中的 id 直接丢弃 */
function mergeItems(cloudArr, localArr, del){
  const map = new Map();
  (cloudArr||[]).forEach(it=>{ if(it && it.id && !del[it.id]) map.set(it.id, it); });
  (localArr||[]).forEach(it=>{
    if(!it || !it.id) return;
    if(del[it.id]){ map.delete(it.id); return; }
    const c = map.get(it.id);
    if(!c) map.set(it.id, it);
    else if((it._u||0) > (c._u||0)) map.set(it.id, it);
  });
  return Array.from(map.values());
}
/* 常用词（按科目）：按 id 取较新的一方 */
function mergeGroups(cloudG, localG){
  const out={};
  SUBJECTS.forEach(s=>{
    const map=new Map();
    ((cloudG&&cloudG[s])||[]).forEach(c=>{ if(c&&c.id) map.set(c.id,c); });
    ((localG&&localG[s])||[]).forEach(c=>{
      if(!c||!c.id) return;
      const o=map.get(c.id); if(!o || (c._u||0)>(o._u||0)) map.set(c.id,c);
    });
    out[s]=Array.from(map.values());
  });
  return out;
}
function mergeDel(cloudD, localD){
  const out=Object.assign({}, cloudD||{}, localD||{});
  const cut=Date.now()-60*24*3600*1000;
  Object.keys(out).forEach(k=>{ if(!out[k] || out[k]<cut) delete out[k]; });
  return out;
}
function pruneTombstones(){
  if(!state._del) return;
  const cut=Date.now()-60*24*3600*1000;
  Object.keys(state._del).forEach(k=>{ if(!state._del[k] || state._del[k]<cut) delete state._del[k]; });
}
/* 云端 + 本机 → 合并结果（顺序确定，便于判断内容是否真的变化） */
function mergeState(cloud, local){
  cloud = cloud || {};
  const del = mergeDel(cloud._del, local._del);
  const delM = mergeDel(cloud._delM, local._delM);
  const delHW = mergeDel(cloud._delHW, local._delHW);
  const masters = mergeItems(cloud.masters||[], local.masters||[], {}).filter(m=>m && !delM[m.id]);
  const hw = mergeGroups(cloud.hw, local.hw);
  SUBJECTS.forEach(s=>{ if(Array.isArray(hw[s])) hw[s]=hw[s].filter(c=>c&&c.id&&!delHW[c.id]); });
  return {
    todos: mergeItems(cloud.todos, local.todos, del),
    tasks: mergeItems(cloud.tasks, local.tasks, del),
    masters,
    hw, _delHW: delHW,
    _del: del, _delM: delM,
    _syncedAt: Math.max(cloud._syncedAt||0, local._syncedAt||0)
  };
}
/* 读取云端文件，返回解析后的对象；无效/缺失返回 null */
async function readCloud(){
  const cfg=syncCfg();
  const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), { headers: syncHeaders(cfg) });
  if(!r.ok) throw { status:r.status };
  const j = await r.json();
  const f = j && j.files && j.files[SYNC_FILE];
  if(!f) return null;
  try{ return JSON.parse(f.content); }catch(e){ return null; }
}
/* 仅在数据指纹变化时才写回云端，避免无意义的写入与 _syncedAt 空转 */
async function writeCloud(obj){
  const cfg=syncCfg();
  obj._syncedAt = Date.now();
  const content = JSON.stringify(obj);
  const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), {
    method:"PATCH",
    headers: Object.assign(syncHeaders(cfg), { "Content-Type":"application/json" }),
    body: JSON.stringify({ files:{ [SYNC_FILE]:{ content } } })
  });
  if(!r.ok) throw { status:r.status };
}
/* 数据指纹：仅含真实数据，不含 _syncedAt 等易变元数据 */
function dataSig(s){
  return JSON.stringify([ (s&&s.todos)||[], (s&&s.tasks)||[], (s&&s.masters)||[], (s&&s._del)||{}, (s&&s._delM)||{}, (s&&s.hw)||{}, (s&&s._delHW)||{} ]);
}
/* 某条目正在本机编辑时，保留本机版本，不被云端覆盖 */
function protectEditing(merged){
  if(!editingId || !merged.todos) return merged;
  const local = state.todos.find(x=>x.id===editingId);
  if(local) merged.todos = merged.todos.map(it=> (it && it.id===editingId) ? local : it);
  return merged;
}
function applyMerged(merged){
  const before = dataSig(state);
  state = merged; saveLocal();
  if(dataSig(state) !== before){ pruneTombstones(); refreshAll(); renderTasks(); }
}
/* 一轮完整同步：取云端 → 与本机合并 → 写回；写后复核消除并发写丢失 */
async function syncCycle(silent){
  if(syncBusy || !syncEnabled()) return false;
  if(document.hidden) return false;            // 后台不抢同步，回到前台再同步
  syncBusy = true; setSyncUI("syncing");
  try{
    const cloud = await readCloud();
    const cloudOk = cloud && typeof cloud==="object" && Array.isArray(cloud.todos);
    let merged = mergeState(cloudOk ? cloud : {}, state);
    protectEditing(merged);
    const cloudSig = cloudOk ? dataSig(cloud) : "";
    if(dataSig(merged) !== cloudSig){
      await writeCloud(merged);
      // 写后复核：若期间另一设备已写入，把对方数据并回后再写一次，杜绝「后写覆盖」丢数据
      const cloud2 = await readCloud();
      if(cloud2 && dataSig(cloud2) !== dataSig(merged)){
        merged = mergeState(cloud2, merged);
        protectEditing(merged);
        await writeCloud(merged);
      }
    }
    lastCloudSig = dataSig(merged);
    applyMerged(merged);
    setSyncUI("ok");
    return true;
  }catch(e){
    setSyncUI("err");
    if(!silent) toast("同步失败："+syncErr(e));
    return false;
  }finally{ syncBusy=false; }
}

/* 仅拉取云端并合并到本机，绝不写云端 —— 用于后台定时与回前台，避免多端在定时器上互相写覆盖 */
async function syncPullOnly(silent){
  if(syncBusy || !syncEnabled() || document.hidden) return false;
  syncBusy = true; setSyncUI("syncing");
  try{
    const cloud = await readCloud();
    if(!cloud || !Array.isArray(cloud.todos)){ setSyncUI("idle"); return false; }
    const cloudSig = dataSig(cloud);
    if(cloudSig === lastCloudSig){ setSyncUI("ok"); return false; }   // 云端无变化，跳过
    let merged = mergeState(cloud, state);
    merged._syncedAt = Math.max(cloud._syncedAt||0, state._syncedAt||0);
    protectEditing(merged);
    lastCloudSig = cloudSig;
    applyMerged(merged);          // 仅更新本机视图，不回写云端
    setSyncUI("ok");
    return true;
  }catch(e){
    setSyncUI("err");
    return false;
  }finally{ syncBusy=false; }
}
/* 数据变更后自动同步：静默 15 秒无操作才上传，合并连击避免刷屏式请求 */
function syncSchedule(){
  if(!syncReady || !syncEnabled() || document.hidden) return;
  clearTimeout(syncPushT);
  syncPushT = setTimeout(()=>{ if(!document.hidden && !syncBusy) syncCycle(true); }, SYNC_DEBOUNCE_MS);
}
/* 离开页面前把待发的同步立刻发出，避免关掉 App 丢改动 */
function syncFlush(){
  if(syncPushT){ clearTimeout(syncPushT); syncPushT=null; syncCycle(true); }
}
function syncInit(){
  if(!syncEnabled()){ syncReady=true; return; }
  syncCycle(true).then(()=>{ syncReady=true; }, ()=>{ syncReady=true; });   // 首启：拉取合并 + 上传本机改动
  setInterval(()=>{ syncPullOnly(true); }, SYNC_INTERVAL_MS);               // 后台每 5 分钟只拉取，不写云端
  let visT=null;
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden) return;
    clearTimeout(visT);
    visT=setTimeout(()=>{ if(!syncBusy) syncCycle(true); }, 5000);   // 回到前台 5 秒后再同步（含上传本机改动）
  });
  window.addEventListener("pagehide", syncFlush);
}
/* 顶部云朵图标状态：syncing / ok / err */
function setSyncUI(kind){
  const el=$("syncBtn");
  if(el){
    el.className="sync-btn "+kind;
    el.title = kind==="ok" ? "云端已同步（点此立即同步）" : (kind==="syncing" ? "正在同步…" : "同步失败，点此重试");
  }
  const st=$("syncStatus");
  if(st){
    const d=new Date();
    st.textContent = kind==="ok" ? "已同步 · "+pad2(d.getHours())+":"+pad2(d.getMinutes())
                   : kind==="syncing" ? "正在同步…"
                   : kind==="idle" ? "已是最新" : "同步失败，请检查网络";
    st.className="sync-status"+(kind==="ok"?" ok":kind==="err"?" err":"");
  }
}
/* 一键配置：支持 .../#t=<token>&g=<gistId>，写入本机后立即把网址里的敏感信息抹掉 */
function syncFromHash(){
  try{
    const h=(location.hash||"").replace(/^#/,""); if(!h) return false;
    const p=new URLSearchParams(h);
    const t=(p.get("t")||"").trim(), g=(p.get("g")||"").trim();
    if(!t || !g) return false;
    localStorage.setItem(SYNC_KEY, JSON.stringify({token:t, gist:g}));
    history.replaceState(null,"",location.pathname+location.search);   // 网址不再含 Token
    return true;
  }catch(e){ return false; }
}

function csvCell(v){ v = v==null?"":String(v); if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function parseCSV(text){
  const rows=[]; let row=[]; let cur=""; let q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch!=='\r') cur+=ch; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function exportExcel(){
  try{
    const head=["日期","科目","作业内容","具体内容","预估(分)","错题(道)","订正","状态","开始","结束","用时(分)"];
    const rows=[head];
    state.todos.forEach(t=>{
      rows.push([t.date, t.subject, t.title, t.detail||"", t.estMin||0, t.wrong||0, t.corrected?"已订正":"未订正", t.done?"已完成":"未开始", t.startClock||"", t.endClock||"", Math.round(recMs(t)/60000)]);
    });
    const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="作业台数据_"+ymd(new Date())+".csv"; a.click();
    toast("已导出 Excel（CSV）"); closeSheet();
  }catch(e){ toast("导出失败"); }
}
function importExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv,application/vnd.ms-excel";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{
      const rows=parseCSV(r.result); if(rows.length<2) throw 0;
      const idx={}; rows[0].map(h=>h.trim()).forEach((h,i)=>idx[h]=i);
      if(idx["日期"]==null || idx["科目"]==null || idx["作业内容"]==null) throw 0;
      const todos=[];
      for(let i=1;i<rows.length;i++){ const c=rows[i]; if(!c || c.length<3) continue;
        const title=(c[idx["作业内容"]]||"").trim(); if(!title) continue;
        const ds=(c[idx["日期"]]||"").trim(); const p=ds.split("-");
        const dt = p.length===3 ? new Date(+p[0], +p[1]-1, +p[2]) : new Date();
        const t=mkTodo(dt, c[idx["科目"]]||"其他", title, {});
        t.detail=(c[idx["具体内容"]]||"").trim();
        t.estMin=parseInt(c[idx["预估(分)"]]!=null?c[idx["预估(分)"]]:c[idx["预估"]]||"0",10)||0;
        t.wrong=parseInt(c[idx["错题(道)"]]!=null?c[idx["错题(道)"]]:c[idx["错题"]]||"0",10)||0;
        t.corrected=((c[idx["订正"]]||"").indexOf("已订正")>=0);
        t.done=((c[idx["状态"]]||"").indexOf("完成")>=0);
        t.startClock=(c[idx["开始"]]||"").trim();
        t.endClock=(c[idx["结束"]]||"").trim();
        const um=parseFloat(c[idx["用时(分)"]]||"0")||0; t.accum=Math.round(um*60000);
        todos.push(t);
      }
      if(todos.length===0) throw 0;
      state.todos=todos; save(); refreshAll(); toast("已导入 "+todos.length+" 条"); closeSheet();
    }catch(e){ toast("Excel 解析失败，请检查格式"); } };
    r.readAsText(f,"utf-8"); };
  inp.click();
}
function bindHold(){
  const btn=$("holdBtn"), fill=$("holdFill"), opt=$("holdOpt");
  if(!btn) return; let raf=null, start=0, dur=3000, holding=false;
  function step(ts){ if(!holding) return; const p=Math.min(1,(ts-start)/dur); fill.style.width=(p*100)+"%";
    if(p>=1){ holding=false; doClearAll(); return; } raf=requestAnimationFrame(step); }
  btn.addEventListener("touchstart",e=>{ e.preventDefault(); holding=true; start=performance.now(); btn.classList.add("go"); raf=requestAnimationFrame(step); });
  btn.addEventListener("touchend",()=>{ holding=false; cancelAnimationFrame(raf); fill.style.width="0"; btn.classList.remove("go"); });
  btn.addEventListener("mousedown",e=>{ e.preventDefault(); holding=true; start=performance.now(); btn.classList.add("go"); raf=requestAnimationFrame(step); });
  btn.addEventListener("mouseup",()=>{ holding=false; cancelAnimationFrame(raf); fill.style.width="0"; btn.classList.remove("go"); });
  btn.addEventListener("mouseleave",()=>{ holding=false; cancelAnimationFrame(raf); fill.style.width="0"; btn.classList.remove("go"); });
}
function doClearAll(){
  state.todos=[]; save(); refreshAll(); closeSheet(); toast("已全部清空");
}

function ensureAudio(){
  if(_audioUnlocked) return;                    // 已解锁 → 任何后续点按/触摸都不再做任何发声动作
  try{
    if(!_ac){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) _ac=new AC(); }
    if(_ac){
      if(_ac.state==="suspended") _ac.resume();
      // 用零增益振荡器静默解锁 WebAudio：iOS/微信要求手势内解锁，且全程不发出任何声音
      if(_ac.state==="running"){
        const o=_ac.createOscillator(), g=_ac.createGain();
        g.gain.value=0; o.connect(g); g.connect(_ac.destination);
        o.start(); o.stop(_ac.currentTime+0.02);
      }
    }
  }catch(e){}
  try{
    // 备用 <audio> 通道：仅在首次手势内静音预播放一次以解锁，之后到点才真正出声
    if(!_dingA){ _dingA=new Audio(DING_WAV); _dingA.preload="auto"; }
    if(_dingA.paused){
      _dingA.volume=0;
      const p=_dingA.play(); if(p&&p.catch) p.catch(()=>{});
      setTimeout(()=>{ try{ _dingA.pause(); _dingA.currentTime=0; _dingA.volume=1; }catch(e){} },50);
    }
  }catch(e){}
  _audioUnlocked=true;
  // 解锁完成后移除全局监听，杜绝“每次点按都有声”的问题
  document.removeEventListener("touchstart", ensureAudio);
  document.removeEventListener("click", ensureAudio);
}
function playDing(){
  let wa=false;
  try{
    if(!_ac){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) _ac=new AC(); }
    if(_ac && _ac.state==="suspended") _ac.resume();
    if(_ac && _ac.state==="running"){
      const ac=_ac, now=ac.currentTime;
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=1046.5;            // C6，清亮的「叮」
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.55, now+0.012);   // 提高音量（0.22→0.55）
      g.gain.exponentialRampToValueAtTime(0.0001, now+0.55);
      o.connect(g); g.connect(ac.destination);
      o.start(now); o.stop(now+0.58);
      wa=true;
    }
  }catch(e){}
  if(!wa){                                                // WebAudio 被拦/未就绪 → 备用 <audio> 通道
    try{
      if(!_dingA){ _dingA=new Audio(DING_WAV); _dingA.preload="auto"; }
      _dingA.currentTime=0;
      const p=_dingA.play(); if(p&&p.catch) p.catch(()=>{});
    }catch(e){}
  }
}
function tickTimers(){
  // 计时到达预估时间 → 播放「叮」提示（仅一次）。对所有“进行中”的计时器生效，与当前所在页无关
  state.todos.forEach(t=>{
    if(t.timerRunning && t.estMin>0 && !t.dinged && recMs(t) >= t.estMin*60000){
      t.dinged=true; playDing(); save();
      toast("⏰ 到达预估时间："+t.title);   // 视觉兜底：万一系统拦掉声音，也能看到提醒
    }
  });
  // 仅更新计时数字与进行中的甘特色块，不整页重渲染
  document.querySelectorAll("[data-timer]").forEach(el=>{
    const t=getTodo(el.dataset.timer); if(t && t.timerRunning){
      el.textContent="● 计时中 "+fmtDur(spentOf(t));
    }
  });
  // 甘特进行块按实际工时向右延伸（不含暂停，与色块“只显示实际工作时间”一致）
  document.querySelectorAll(".gblock.g-run").forEach(b=>{
    const track=b.closest(".gantt-track"); if(!track) return;
    const span=+track.dataset.span; if(!span) return;
    const t=getTodo(b.dataset.gid); if(!t) return;
    let w=(spentOf(t)/60000/span)*100; if(w<4)w=4; if(w>100)w=100;
    b.style.width=w+"%";
  });
}

/* ============ 启动收尾（防后台虚增） ============ */
function boot(){
  // 首次任意点击/触摸即解锁音频（iOS Safari、微信内置浏览器要求声音在用户手势后才能播放）
  document.addEventListener("touchstart", ensureAudio, {passive:true});
  document.addEventListener("click", ensureAudio);
  const now=Date.now();
  state.todos.forEach(t=>{
    if(t.timerRunning && t.startedAt){
      t.accum += (now - t.startedAt); t.timerRunning=false; t.startedAt=null;
      segClose(t, nowClock());      // 收尾时闭合遗留的分段
    }
  });
  save();
}

/* ============ 机型切换 / 真机识别 ============ */
function setMode(mode){
  const phone=$("phone"); phone.classList.remove("mode-iphone11","mode-iphone17","mode-ipad","mode-pc");
  phone.classList.add("mode-"+mode);
  const stage=$("stage"); if(stage) stage.classList.toggle("stage-pc", mode==="pc");
  $("m11").classList.toggle("on",mode==="iphone11");
  $("m17").classList.toggle("on",mode==="iphone17");
  $("mip").classList.toggle("on",mode==="ipad");
  const mpc=$("mpc"); if(mpc) mpc.classList.toggle("on",mode==="pc");
}
function detectReal(){
  // 真机：短边 >=700 视为平板（iPad）；否则用 env(safe-area-inset-top) 区分刘海/灵动岛
  const shortSide=Math.min(window.innerWidth, window.innerHeight);
  if(shortSide>=700){ setMode("ipad"); return; }
  const probe=document.createElement("div");
  probe.style.cssText="position:fixed;top:env(safe-area-inset-top);left:0;height:0;";
  document.body.appendChild(probe);
  const top=probe.getBoundingClientRect().top;
  document.body.removeChild(probe);
  if(top>=50){ setMode("iphone17"); }
  else if(top>0){ setMode("iphone11"); }
}

/* ============ Toast ============ */
let toastT=null;
/* ===== 自动检测新版本（解决浏览器/手机缓存导致看不到更新）=====
   原理：页面内嵌一个版本号，启动时（及之后每隔 5 分钟）去取站点根目录下的
   version.json（带时间戳防缓存）。若版本号不一致，底部弹出「发现新版本」提示，
   点一下才刷新。这样既能绕开缓存，又不会在你正计时的时候被强制打断。 */
const APP_VERSION = "2026.09.10.42";
let remoteVer = null;
async function checkUpdate(silent){
  try{
    const r = await fetch("version.json?t="+Date.now(), { cache:"no-store" });
    if(!r.ok) return;
    const j = await r.json();
    const v = j.v || j.version;
    if(!v || v===APP_VERSION){ return; }
    remoteVer = v;
    const bar = $("upbar");
    if(bar && !bar.classList.contains("show")){
      bar.classList.add("show");
      if(!silent) toast("有新版本可用");
    }
  }catch(e){ /* 离线或本地文件打开时忽略 */ }
}
function applyUpdate(){
  const bar = $("upbar");
  if(bar) bar.classList.remove("show");
  const tag = remoteVer || Date.now();
  try{
    const u = new URL(location.href);
    u.searchParams.set("v", tag);
    location.replace(u.toString());
  }catch(e){ location.reload(); }
}

function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1500); }

/* ============ 状态栏时钟 ============ */
function tickClock(){
  const d=new Date(); const hh=d.getHours(); const mm=pad2(d.getMinutes());
  const t=$("sbTime"); if(t) t.textContent=hh+":"+mm;
}

function init(){
  seedAccounts();                       // 预置 lvcheng 账号
  const u=currentUser();
  if(u && loadAccounts()[u]){
    loginAs(u); hideLogin(); startApp();
  }else{
    showLogin();
    load(); boot(); renderList(); refreshHeader();   // 登录页背后渲染空壳，避免白屏
  }
}
/* 登录成功后启动应用（原 init 主体） */
function startApp(){
  const autoCfg = syncFromHash();      // 通过一键配置链接打开时，自动写入 Token / Gist ID
  load();
  boot();
  refreshHeader();
  renderList();
  const urlMode = new URLSearchParams(location.search).get("mode");
  const isReal = window.innerWidth<480;
  if(isReal){ $("app").classList.add("real"); detectReal(); }
  else if(urlMode==="iphone11" || urlMode==="iphone17" || urlMode==="ipad" || urlMode==="pc"){ setMode(urlMode); }
  else { setMode(window.innerWidth>=820 ? "pc" : "ipad"); }
  tickClock(); setInterval(tickClock, 10000);
  setInterval(tickTimers, 1000);
  switchTab("list");
  bindPull();                          // 启用下拉刷新
  if(autoCfg) toast("云同步已配置，正在连接…");
  syncInit();          // 已配置则打开时自动拉取云端数据
  checkUpdate(true);                              // 启动时查一次新版本（静默）
  setInterval(()=>{ if(!document.hidden) checkUpdate(true); }, 300000);  // 之后每 5 分钟查一次
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
