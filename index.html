/* 下拉刷新：在页面顶部下拉触发自动同步 */
let _pull=null;
function bindPull(){
  if(_pull) return; _pull=1;
  const hint=$("pullHint");
  document.querySelectorAll(".page").forEach(p=>{
    let startY=0, pulling=false, y=0;
    p.addEventListener("touchstart", e=>{ if(p.scrollTop<=0){ startY=e.touches[0].clientY; pulling=true; } }, {passive:true});
    p.addEventListener("touchmove", e=>{
      if(!pulling) return;
      const dy=e.touches[0].clientY-startY;
      if(dy>0 && p.scrollTop<=0){
        if(e.cancelable) e.preventDefault();
        y=Math.min(dy*0.5, 80);
        if(hint){ hint.style.height="32px"; hint.textContent = y>55 ? "松开立即同步" : "↓ 下拉刷新"; }
      } else { pulling=false; if(hint){ hint.style.height="0"; } }
    }, {passive:false});
    p.addEventListener("touchend", ()=>{
      if(pulling && y>55){ hint.textContent="正在同步…"; syncCycle(true); setTimeout(()=>{ if(hint) hint.style.height="0"; }, 700); }
      else if(hint){ hint.style.height="0"; }
      pulling=false; y=0;
    });
  });
}

function syncCfg(){ try{ return JSON.parse(localStorage.getItem(SYNC_KEY))||{}; }catch(e){ return {}; } }
function syncEnabled(){ const c=syncCfg(); return !!(c.token && c.gist); }

function syncStatus(msg, type){
  const el=$("syncStatus"); if(!el) return;
  el.textContent=msg||""; el.className="sync-status"+(type?" "+type:"");
}
function syncErr(e){
  const s = e && e.status;
  if(s===401) return "Token 无效或已过期";
  if(s===404) return "Gist 未找到，检查 Gist ID";
  if(s===403) return "请求被拒绝（可能触发限流）";
  if(s===-2)  return "云端缺少 "+SYNC_FILE+" 文件";
  if(s===-3)  return "云端数据格式不正确";
  if(s===-4)  return "云端暂无有效数据";
  return "网络异常，请检查联网";
}
function syncHeaders(cfg){
  return { "Authorization":"token "+cfg.token, "Accept":"application/vnd.github+json" };
}
/* 保存用户填写的 Token / Gist ID（只存本机） */
function syncSaveCfg(){
  const t=($("syncToken").value||"").trim();
  let g=($("syncGist").value||"").trim();
  g = g.replace(/^.*gist\.github\.com\/[^\/]+\//,"").replace(/\/.*$/,"").trim();  // 允许直接粘贴完整网址
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify({token:t, gist:g})); }catch(e){}
  if(t && g){
    syncStatus("配置已保存到本机","ok"); toast("配置已保存，正在连接…");
    syncCycle(true);     // 立即合并一次（云端有数据则合并，云端为空则上传本机）
  }else{
    syncStatus("请填写完整的 Token 与 Gist ID","err"); toast("请填写完整的 Token 与 Gist ID");
  }
}
/* 从云端下载。mode="auto"：仅在云端不比本机旧时覆盖，且不弹 toast；其他值：强制覆盖并提示 */
async function syncPull(mode){
  const cfg=syncCfg();
  if(!cfg.token || !cfg.gist){
    if(mode!=="auto"){ syncStatus("请先填写 Token 与 Gist ID","err"); toast("请先填写 Token 与 Gist ID"); }
    return false;
  }
  if(mode!=="auto") syncStatus("正在从云端下载…");
  try{
    const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), { headers: syncHeaders(cfg) });
    if(!r.ok) throw { status:r.status };
    const j = await r.json();
    const f = j && j.files && j.files[SYNC_FILE];
    if(!f) throw { status:-2 };
    const data = JSON.parse(f.content);
    if(!data || typeof data!=="object") throw { status:-3 };

    /* ---- 覆盖决策：安全优先，绝不让“空/只有示例”的云端吞掉本机真实数据 ---- */
    const cTodos    = Array.isArray(data.todos) ? data.todos : [];
    const cloudN    = cTodos.length;                                  // 云端总条数
    const cloudReal = cTodos.filter(x=>!x.sample).length;             // 云端真实条数（不含示例）
    const cloudAt   = data._syncedAt || 0;
    const lTodos    = (state.todos||[]);
    const localN    = lTodos.length;
    const localReal = lTodos.filter(x=>!x.sample).length;
    const localAt   = state._syncedAt || 0;

    if(mode==="auto"){
      if(cloudN===0){ syncStatus("云端暂无数据，保留本机"); return false; }          // → 随后上传本机
      if(localReal>0 && cloudReal===0){ syncStatus("云端只有示例数据，保留本机"); return false; }
      if(localReal>0 && cloudAt<=localAt){ syncStatus("本机数据已是最新"); return true; }
      // 其余情况（本机只有示例 / 云端明显更新）→ 采用云端
    }else{
      // 手动下载会覆盖本机，先二次确认
      if(localN>0){
        const tip = cloudN===0
          ? "云端暂无作业数据，继续下载会清空本机的 "+localN+" 条作业。确定吗？"
          : "从云端下载会用云端的 "+cloudN+" 条作业覆盖本机的 "+localN+" 条。确定吗？";
        if(!confirm(tip)){ syncStatus("已取消下载"); return false; }
      }
    }

    state = data; state._syncedAt = cloudAt;
    if(!Array.isArray(state.todos)) state.todos = [];
    if(!state.tasks)    state.tasks    = [];
    if(!Array.isArray(state.masters)) state.masters = [];
    if(!state._delM) state._delM = {};
    state.masters = state.masters.filter(m=>m && !((state._delM||{})[m.id]));   // 应用母版删除墓碑
    delete state.chips; delete state.hot; delete state.hotBlock;   // 常用词功能已移除
    if(Array.isArray(state.todos)) state.todos = state.todos.filter(t=>!t.sample);  // 自愈：剔除云端残留示例数据
    if(Array.isArray(state.tasks)) state.tasks = state.tasks.filter(t=>!t.sample);
    saveLocal(); recomputeHot(); refreshAll(); renderTasks();
    const n = (state.todos||[]).length;
    syncStatus("已同步云端 "+n+" 条作业","ok");
    if(mode!=="auto") toast("已下载云端数据 "+n+" 条");
    return true;
  }catch(e){
    const msg = syncErr(e);
    syncStatus("下载失败："+msg,"err");
    if(mode!=="auto") toast("下载失败："+msg);
    return false;
  }
}
/* 把本机数据整体上传到云端 */
async function syncPush(silent){
  const cfg=syncCfg();
  if(!cfg.token || !cfg.gist){
    if(!silent){ syncStatus("请先填写 Token 与 Gist ID","err"); toast("请先填写 Token 与 Gist ID"); }
    return false;
  }
  if(!silent) syncStatus("正在上传到云端…");
  try{
    state._syncedAt = Date.now();
    /* 只上传真实数据：示例（sample:true）永不进云端，避免污染 */
    const up = JSON.parse(JSON.stringify(state));
    if(Array.isArray(up.todos)) up.todos = up.todos.filter(t=>!t.sample);
    if(Array.isArray(up.tasks)) up.tasks = up.tasks.filter(t=>!t.sample);
    delete up.chips; delete up.hot; delete up.hotBlock;   // 常用词功能已移除，永不进云端
    const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), {
      method:"PATCH",
      headers: Object.assign(syncHeaders(cfg), { "Content-Type":"application/json" }),
      body: JSON.stringify({ files:{ [SYNC_FILE]:{ content: JSON.stringify(up) } } })
    });
    if(!r.ok) throw { status:r.status };
    saveLocal();
    const d=new Date();
    syncStatus("已上传 · "+pad2(d.getHours())+":"+pad2(d.getMinutes()),"ok");
    if(!silent) toast("已上传到云端");
    return true;
  }catch(e){
    const msg = syncErr(e);
    syncStatus("上传失败："+msg,"err");
    if(!silent) toast("上传失败："+msg);
    return false;
  }
}
/* ============ 自动同步核心 ============
   每次同步 =「取云端 → 与本机逐条合并 → 写回云端」。
   同一条数据以「最后修改时间 _u」较新的一方为准，删除走墓碑，
   因此任何一端的新数据都不会被另一端的旧数据覆盖。 */
let syncBusy = false;

/* 按 id 合并两组条目：同 id 取 _u 更大的一方；墓碑中的 id 直接丢弃 */
function mergeItems(cloudArr, localArr, del){
  const map = new Map();
  (cloudArr||[]).forEach(it=>{ if(it && it.id && !del[it.id]) map.set(it.id, it); });
  (localArr||[]).forEach(it=>{
    if(!it || !it.id) return;
    if(del[it.id]){ map.delete(it.id); return; }
    const c = map.get(it.id);
    if(!c) map.set(it.id, it);
    else if((it._u||0) > (c._u||0)) map.set(it.id, it);
  });
  return Array.from(map.values());
}
/* 关键词类（chips / hot）：按 id 取较新的一方 */
function mergeGroups(cloudG, localG){
  const out={};
  SUBJECTS.forEach(s=>{
    const map=new Map();
    ((cloudG&&cloudG[s])||[]).forEach(c=>{ if(c&&c.id) map.set(c.id,c); });
    ((localG&&localG[s])||[]).forEach(c=>{
      if(!c||!c.id) return;
      const o=map.get(c.id); if(!o || (c._u||0)>(o._u||0)) map.set(c.id,c);
    });
    out[s]=Array.from(map.values());
  });
  return out;
}
function mergeBlock(cloudB, localB){
  const out={};
  SUBJECTS.forEach(s=>{ out[s]=Array.from(new Set([].concat((cloudB&&cloudB[s])||[], (localB&&localB[s])||[]))); });
  return out;
}
function mergeDel(cloudD, localD){
  const out=Object.assign({}, cloudD||{}, localD||{});
  const cut=Date.now()-60*24*3600*1000;
  Object.keys(out).forEach(k=>{ if(!out[k] || out[k]<cut) delete out[k]; });
  return out;
}
function pruneTombstones(){
  if(!state._del) return;
  const cut=Date.now()-60*24*3600*1000;
  Object.keys(state._del).forEach(k=>{ if(!state._del[k] || state._del[k]<cut) delete state._del[k]; });
}
/* 云端 + 本机 → 合并结果（顺序确定，便于判断内容是否真的变化） */
function mergeState(cloud, local){
  cloud = cloud || {};
  const del = mergeDel(cloud._del, local._del);
  const delM = mergeDel(cloud._delM, local._delM);
  const masters = mergeItems(cloud.masters||[], local.masters||[], {}).filter(m=>m && !delM[m.id]);
  return {
    todos: mergeItems(cloud.todos, local.todos, del),
    tasks: mergeItems(cloud.tasks, local.tasks, del),
    masters,
    _del: del, _delM: delM,
    _syncedAt: Math.max(cloud._syncedAt||0, local._syncedAt||0)
  };
}
/* 读取云端文件，返回解析后的对象；无效/缺失返回 null */
async function readCloud(){
  const cfg=syncCfg();
  const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), { headers: syncHeaders(cfg) });
  if(!r.ok) throw { status:r.status };
  const j = await r.json();
  const f = j && j.files && j.files[SYNC_FILE];
  if(!f) return null;
  try{ return JSON.parse(f.content); }catch(e){ return null; }
}
/* 仅在数据指纹变化时才写回云端，避免无意义的写入与 _syncedAt 空转 */
async function writeCloud(obj){
  const cfg=syncCfg();
  obj._syncedAt = Date.now();
  const content = JSON.stringify(obj);
  const r = await fetch("https://api.github.com/gists/"+encodeURIComponent(cfg.gist), {
    method:"PATCH",
    headers: Object.assign(syncHeaders(cfg), { "Content-Type":"application/json" }),
    body: JSON.stringify({ files:{ [SYNC_FILE]:{ content } } })
  });
  if(!r.ok) throw { status:r.status };
}
/* 数据指纹：仅含真实数据，不含 _syncedAt 等易变元数据 */
function dataSig(s){
  return JSON.stringify([ (s&&s.todos)||[], (s&&s.tasks)||[], (s&&s.masters)||[], (s&&s._del)||{}, (s&&s._delM)||{} ]);
}
/* 某条目正在本机编辑时，保留本机版本，不被云端覆盖 */
function protectEditing(merged){
  if(!editingId || !merged.todos) return merged;
  const local = state.todos.find(x=>x.id===editingId);
  if(local) merged.todos = merged.todos.map(it=> (it && it.id===editingId) ? local : it);
  return merged;
}
function applyMerged(merged){
  const before = dataSig(state);
  state = merged; saveLocal();
  if(dataSig(state) !== before){ pruneTombstones(); recomputeHot(); refreshAll(); renderTasks(); }
}
/* 一轮完整同步：取云端 → 与本机合并 → 写回；写后复核消除并发写丢失 */
async function syncCycle(silent){
  if(syncBusy || !syncEnabled()) return false;
  if(document.hidden) return false;            // 后台不抢同步，回到前台再同步
  syncBusy = true; setSyncUI("syncing");
  try{
    const cloud = await readCloud();
    const cloudOk = cloud && typeof cloud==="object" && Array.isArray(cloud.todos);
    let merged = mergeState(cloudOk ? cloud : {}, state);
    protectEditing(merged);
    const cloudSig = cloudOk ? dataSig(cloud) : "";
    if(dataSig(merged) !== cloudSig){
      await writeCloud(merged);
      // 写后复核：若期间另一设备已写入，把对方数据并回后再写一次，杜绝「后写覆盖」丢数据
      const cloud2 = await readCloud();
      if(cloud2 && dataSig(cloud2) !== dataSig(merged)){
        merged = mergeState(cloud2, merged);
        protectEditing(merged);
        await writeCloud(merged);
      }
    }
    lastCloudSig = dataSig(merged);
    applyMerged(merged);
    setSyncUI("ok");
    return true;
  }catch(e){
    setSyncUI("err");
    if(!silent) toast("同步失败："+syncErr(e));
    return false;
  }finally{ syncBusy=false; }
}

/* 数据变更后自动同步：静默 6 秒无操作才上传，合并连击避免刷屏式请求 */
function syncSchedule(){
  if(!syncReady || !syncEnabled() || document.hidden) return;
  clearTimeout(syncPushT);
  syncPushT = setTimeout(()=>{ if(!document.hidden && !syncBusy) syncCycle(true); }, SYNC_DEBOUNCE_MS);
}
/* 离开页面前把待发的同步立刻发出，避免关掉 App 丢改动 */
function syncFlush(){
  if(syncPushT){ clearTimeout(syncPushT); syncPushT=null; syncCycle(true); }
}
function syncInit(){
  if(!syncEnabled()){ syncReady=true; return; }
  syncCycle(true).then(()=>{ syncReady=true; }, ()=>{ syncReady=true; });
  setInterval(()=>{ if(!document.hidden && !syncBusy) syncCycle(true); }, SYNC_INTERVAL_MS);  // 后台每 2 分钟拉取
  let visT=null;
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden) return;
    clearTimeout(visT);
    visT=setTimeout(()=>{ if(!syncBusy) syncCycle(true); }, 2000);   // 回到前台 2 秒后再同步，避免与编辑/定时堆叠
  });
  window.addEventListener("pagehide", syncFlush);
}
/* 顶部云朵图标状态：syncing / ok / err */
function setSyncUI(kind){
  const el=$("syncBtn");
  if(el){
    el.className="sync-btn "+kind;
    el.title = kind==="ok" ? "云端已同步（点此立即同步）" : (kind==="syncing" ? "正在同步…" : "同步失败，点此重试");
  }
  const st=$("syncStatus");
  if(st){
    const d=new Date();
    st.textContent = kind==="ok" ? "已同步 · "+pad2(d.getHours())+":"+pad2(d.getMinutes())
                   : kind==="syncing" ? "正在同步…" : "同步失败，请检查网络";
    st.className="sync-status"+(kind==="ok"?" ok":kind==="err"?" err":"");
  }
}
/* 一键配置：支持 .../#t=<token>&g=<gistId>，写入本机后立即把网址里的敏感信息抹掉 */
function syncFromHash(){
  try{
    const h=(location.hash||"").replace(/^#/,""); if(!h) return false;
    const p=new URLSearchParams(h);
    const t=(p.get("t")||"").trim(), g=(p.get("g")||"").trim();
    if(!t || !g) return false;
    localStorage.setItem(SYNC_KEY, JSON.stringify({token:t, gist:g}));
    history.replaceState(null,"",location.pathname+location.search);   // 网址不再含 Token
    return true;
  }catch(e){ return false; }
}

function csvCell(v){ v = v==null?"":String(v); if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function parseCSV(text){
  const rows=[]; let row=[]; let cur=""; let q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=""; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(ch!=='\r') cur+=ch; }
  }
  if(cur.length||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function exportExcel(){
  try{
    const head=["日期","科目","作业内容","具体内容","预估(分)","错题(道)","状态","开始","结束","用时(分)"];
    const rows=[head];
    state.todos.forEach(t=>{
      rows.push([t.date, t.subject, t.title, t.detail||"", t.estMin||0, t.wrong||0, t.done?"已完成":"未开始", t.startClock||"", t.endClock||"", Math.round(spentOf(t)/60000)]);
    });
    const csv="﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="作业台数据_"+ymd(new Date())+".csv"; a.click();
    toast("已导出 Excel（CSV）"); closeSheet();
  }catch(e){ toast("导出失败"); }
}
function importExcel(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".csv,text/csv,application/vnd.ms-excel";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{
      const rows=parseCSV(r.result); if(rows.length<2) throw 0;
      const idx={}; rows[0].map(h=>h.trim()).forEach((h,i)=>idx[h]=i);
      if(idx["日期"]==null || idx["科目"]==null || idx["作业内容"]==null) throw 0;
      const todos=[];
      for(let i=1;i<rows.length;i++){ const c=rows[i]; if(!c || c.length<3) continue;
        const title=(c[idx["作业内容"]]||"").trim(); if(!title) continue;
        const ds=(c[idx["日期"]]||"").trim(); const p=ds.split("-");
        const dt = p.length===3 ? new Date(+p[0], +p[1]-1, +p[2]) : new Date();
        const t=mkTodo(dt, c[idx["科目"]]||"其他", title, {});
        t.detail=(c[idx["具体内容"]]||"").trim();
        t.estMin=parseInt(c[idx["预估(分)"]]!=null?c[idx["预估(分)"]]:c[idx["预估"]]||"0",10)||0;
        t.wrong=parseInt(c[idx["错题(道)"]]!=null?c[idx["错题(道)"]]:c[idx["错题"]]||"0",10)||0;
        t.done=((c[idx["状态"]]||"").indexOf("完成")>=0);
        t.startClock=(c[idx["开始"]]||"").trim();
        t.endClock=(c[idx["结束"]]||"").trim();
        const um=parseFloat(c[idx["用时(分)"]]||"0")||0; t.accum=Math.round(um*60000);
        todos.push(t);
      }
      if(todos.length===0) throw 0;
      state.todos=todos; recomputeHot(); save(); refreshAll(); toast("已导入 "+todos.length+" 条"); closeSheet();
    }catch(e){ toast("Excel 解析失败，请检查格式"); } };
    r.readAsText(f,"utf-8"); };
  inp.click();
}
function clearSample(){
  const before=state.todos.length+state.tasks.length;
  state.todos=state.todos.filter(t=>!t.sample);
  state.tasks=state.tasks.filter(t=>!t.sample);
  recomputeHot(); save(); refreshAll(); renderTasks(); toast("已清除示例 "+ (before-(state.todos.length+state.tasks.length)) +" 条"); closeSheet();
}
function bindHold(){
  const btn=$("holdBtn"), fill=$("holdFill"), opt=$("holdOpt");
  if(!btn) return; let raf=null, start=0, dur=3000, holding=false;
  function step(ts){ if(!holding) return; const p=Math.min(1,(ts-start)/dur); fill.style.width=(p*100)+"%";
    if(p>=1){ holding=false; doClearAll(); return; } raf=requestAnimationFrame(step); }
  btn.addEventListener("touchstart",e=>{ e.preventDefault(); holding=true; start=performance.now(); btn.classList.add("go"); raf=requestAnimationFrame(step); });
  btn.addEventListener("touchend",()=>{ holding=false; cancelAnimationFrame(raf); fill.style.width="0"; btn.classList.remove("go"); });
  btn.addEventListener("mousedown",e=>{ e.preventDefault(); holding=true; start=performance.now(); btn.classList.add("go"); raf=requestAnimationFrame(step); });
  btn.addEventListener("mouseup",()=>{ holding=false; cancelAnimationFrame(raf); fill.style.width="0"; btn.classList.remove("go"); });
  btn.addEventListener("mouseleave",()=>{ holding=false; cancelAnimationFrame(raf); fill.style.width="0"; btn.classList.remove("go"); });
}
function doClearAll(){
  state.todos=[]; save(); refreshAll(); closeSheet(); toast("已全部清空");
}

/* ============ 计时器实时刷新 ============ */

    const t=getTodo(el.dataset.timer); if(t && t.timerRunning) el.textContent="● 计时中 "+fmtDur(spentOf(t));
  });
  // 甘特进行块按实际工时向右延伸（不含暂停，与色块“只显示实际工作时间”一致）
  document.querySelectorAll(".gblock.g-run").forEach(b=>{

    const t=getTodo(b.dataset.gid); if(!t) return;

}

/* ============ 启动收尾（防后台虚增） ============ */
function boot(){
  const now=Date.now();
  state.todos.forEach(t=>{
    if(t.timerRunning && t.startedAt){
      t.accum += (now - t.startedAt); t.timerRunning=false; t.startedAt=null;
      segClose(t, nowClock());      // 收尾时闭合遗留的分段
    }
  });

}

function detectReal(){
  // 真机：短边 >=700 视为平板（iPad）；否则用 env(safe-area-inset-top) 区分刘海/灵动岛
  const shortSide=Math.min(window.innerWidth, window.innerHeight);
  if(shortSide>=700){ setMode("ipad"); return; }
  const probe=document.createElement("div");
  probe.style.cssText="position:fixed;top:env(safe-area-inset-top);left:0;height:0;";
  document.body.appendChild(probe);
  const top=probe.getBoundingClientRect().top;
  document.body.removeChild(probe);
  if(top>=50){ setMode("iphone17"); }
  else if(top>0){ setMode("iphone11"); }
}

/* ============ Toast ============ */
let toastT=null;
/* ===== 自动检测新版本（解决浏览器/手机缓存导致看不到更新）=====
   原理：页面内嵌一个版本号，启动时（及之后每隔 5 分钟）去取站点根目录下的
   version.json（带时间戳防缓存）。若版本号不一致，底部弹出「发现新版本」提示，
   点一下才刷新。这样既能绕开缓存，又不会在你正计时的时候被强制打断。 */
const APP_VERSION = "2026.09.10.9";
let remoteVer = null;
async function checkUpdate(silent){
  try{
    const r = await fetch("version.json?t="+Date.now(), { cache:"no-store" });
    if(!r.ok) return;
    const j = await r.json();
    const v = j.v || j.version;
    if(!v || v===APP_VERSION){ return; }
    remoteVer = v;
    const bar = $("upbar");
    if(bar && !bar.classList.contains("show")){
      bar.classList.add("show");
      if(!silent) toast("有新版本可用");
    }
  }catch(e){ /* 离线或本地文件打开时忽略 */ }
}
function applyUpdate(){
  const bar = $("upbar");
  if(bar) bar.classList.remove("show");
  const tag = remoteVer || Date.now();
  try{
    const u = new URL(location.href);
    u.searchParams.set("v", tag);
    location.replace(u.toString());
  }catch(e){ location.reload(); }
}

function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1500); }

  else if(urlMode==="iphone11" || urlMode==="iphone17" || urlMode==="ipad" || urlMode==="pc"){ setMode(urlMode); }
  else { setMode(window.innerWidth>=820 ? "pc" : "ipad"); }
  tickClock(); setInterval(tickClock, 10000);
  setInterval(tickTimers, 1000);
  switchTab("list");
  bindPull();                          // 启用下拉刷新
  if(autoCfg) toast("云同步已配置，正在连接…");
  syncInit();          // 已配置则打开时自动拉取云端数据
  checkUpdate(true);                              // 启动时查一次新版本（静默）
  setInterval(()=>{ if(!document.hidden) checkUpdate(true); }, 300000);  // 之后每 5 分钟查一次
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
