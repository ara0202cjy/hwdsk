<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2F5D50" />
<title>作业台</title>
<style>
  :root{
    --ink:#2F5D50;        /* 墨绿 主色 */
    --ink-2:#3E7A69;
    --ink-soft:#E7EFEA;
    --sun:#E8853B;        /* 暖阳橙 强调 */
    --sun-soft:#FBE9D8;
    --paper:#F7F2E7;      /* 米白 纸张 */
    --card:#FFFFFF;
    --text:#2B2B2B;
    --muted:#9A948A;
    --line:#ECE6D8;
    --red:#C0392B;
    --green:#3FA46A;
    --gray:#C9C3B6;
    --shadow:0 6px 18px rgba(47,93,80,.10);
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB",sans-serif;
    background:#0e1116; color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;}

  /* ===== 桌面预览舞台 ===== */
  .stage{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:14px; padding:18px 12px 30px;
  }
  .modebar{
    display:flex; align-items:center; gap:10px; color:#cfd6dd;
    font-size:13px; flex-wrap:wrap; justify-content:center;
  }
  .modebar .seg{display:inline-flex; background:#1b2027; border-radius:999px; padding:4px;}
  .modebar .seg button{color:#aeb6bf; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:600;}
  .modebar .seg button.on{background:var(--ink); color:#fff;}
  .modebar .hint{opacity:.6;}

  /* ===== 手机外框 ===== */
  .phone{
    --sat-sim:44px; --sab-sim:34px;
    position:relative; background:#0b0d10;
    border-radius:54px; padding:13px;
    box-shadow:0 30px 70px rgba(0,0,0,.55), inset 0 0 0 2px #2a2e35;
    transition:width .3s, height .3s;
  }
  .phone.mode-iphone11{ --sat-sim:44px; width:440px; height:936px; border-radius:54px;}
  .phone.mode-iphone17{ --sat-sim:62px; width:428px; height:914px; border-radius:60px;}
  /* iPad 横屏平板外框（无刘海/灵动岛，均匀窄边） */
  .phone.mode-ipad{ --sat-sim:0; width:1080px; height:760px; border-radius:22px;}
  .phone.mode-ipad::before,.phone.mode-ipad::after{display:none;}
  .mode-ipad .phead h1{font-size:23px;}
  .mode-ipad .tabbar{font-size:15px;}
  /* ===== 电脑端（PC）宽屏布局 ===== */
  .phone.mode-pc{ --sat-sim:0; width:100%; height:100vh; max-width:none; border-radius:0; padding:0; background:var(--paper);}
  .phone.mode-pc::before,.phone.mode-pc::after{display:none;}
  .phone.mode-pc .screen{border-radius:0; background:var(--paper);}
  .mode-pc .notch,.mode-pc .island,.mode-pc .statusbar,.mode-pc .home-bar{display:none;}
  .mode-pc .app-root{ flex-direction:column; }
  .mode-pc .tabbar{
    position:absolute; left:0; top:0; bottom:0; width:212px;
    flex-direction:column; align-items:stretch; gap:4px;
    border-top:none; border-right:1px solid var(--line);
    padding:24px 14px; background:var(--paper); z-index:55;
  }
  .mode-pc .tabbar .brand{display:flex; align-items:center; gap:9px; font-size:20px; font-weight:800; color:var(--ink); padding:0 12px 20px; letter-spacing:2px;}
  .mode-pc .tab{ flex-direction:row; justify-content:flex-start; gap:12px; padding:13px 14px; border-radius:12px;}
  .mode-pc .tab .lb{font-size:14.5px;}
  .mode-pc .tab.on{background:var(--ink-soft);}
  .mode-pc .tab.on .lb{color:var(--ink);}
  .mode-pc .tab:hover{background:var(--ink-soft);}
  .mode-pc .app-body{ position:absolute; top:0; bottom:0; left:212px; right:0; }
  .mode-pc .content{max-width:1080px; margin:0 auto; padding:14px 30px 30px;}
  .mode-pc .sticky{ padding:14px 30px 8px; }
  .mode-pc .sum-grid{grid-template-columns:repeat(3,1fr); gap:14px;}
  .mode-pc .phead h1{font-size:26px;}
  .mode-pc .datebar{font-size:15px;}
  .stage-pc{ background:var(--paper); padding:0; }
  .stage-pc .modebar{display:none;}
  /* 侧边按键 */
  .phone::before,.phone::after{content:""; position:absolute; left:-3px; width:3px; background:#2a2e35; border-radius:3px;}
  .phone::before{top:200px; height:64px;}
  .phone::after{top:285px; height:96px; box-shadow:0 110px 0 #2a2e35;}
  .screen{
    position:relative; width:100%; height:100%;
    background:var(--paper); border-radius:42px; overflow:hidden;
  }
  .phone.mode-iphone17 .screen{border-radius:48px;}

  /* ===== App 根 ===== */
  .app-root{
    --sat:max(env(safe-area-inset-top,0px), var(--sat-sim,0px));
    --sab:max(env(safe-area-inset-bottom,0px), var(--sab-sim,0px));
    position:absolute; inset:0; display:flex; flex-direction:column;
    background:var(--paper); overflow:hidden;
    padding-top:var(--sat);
  }

  /* ===== 状态栏 ===== */
  .statusbar{
    height:var(--sat); flex:0 0 auto; position:relative;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; padding-top:8px;
    font-size:15px; font-weight:600; color:#1c1c1e; z-index:60;
  }
  .statusbar .time{letter-spacing:.3px;}
  .statusbar .indicators{display:flex; align-items:center; gap:6px;}
  .statusbar svg{display:block;}
  /* 刘海 */
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:170px; height:30px; background:#000; border-radius:0 0 20px 20px; z-index:61;
  }
  /* 灵动岛 */
  .island{
    position:absolute; top:9px; left:50%; transform:translateX(-50%);
    width:118px; height:34px; background:#000; border-radius:20px; z-index:61;
  }
  .phone.mode-iphone11 .island{display:none;}
  .phone.mode-iphone17 .notch{display:none;}

  /* ===== 页面主体 ===== */
  .app-body{flex:1 1 auto; min-height:0; position:relative;}
  .page{position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .page.active{display:flex;}
  .page::-webkit-scrollbar{width:0;}

  .sticky{
    position:sticky; top:0; z-index:40;
    background:linear-gradient(180deg,var(--paper) 86%, rgba(247,242,231,0));
    padding:10px 16px 6px;
  }
  .phead{display:flex; align-items:center; justify-content:space-between;}
  .phead h1{font-size:21px; margin:0; color:var(--ink); font-weight:800; letter-spacing:.5px;}
  .phead .gear{width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:12px; color:var(--ink);}
  /* 顶部云同步状态灯：灰=未配置/闲置 绿=已同步 黄=同步中 红=失败 */
  .phead .sync-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; border-radius:12px; color:var(--muted); position:relative; transition:color .2s;}
  .phead .sync-btn.ok{color:var(--green);}
  .phead .sync-btn.syncing{color:var(--sun);}
  .phead .sync-btn.err{color:var(--red);}
  .phead .sync-btn::after{content:""; position:absolute; right:6px; top:6px; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:0;}
  .phead .sync-btn.ok::after{opacity:.85;}
  .phead .sync-btn.syncing::after{opacity:1; animation:syncpulse 1s ease-in-out infinite;}
  @keyframes syncpulse{0%,100%{opacity:.25;} 50%{opacity:1;}}
  .phead .gear:active{background:var(--ink-soft);}

  /* 日期控制条 */
  .datebar{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
  .date-btn{display:flex; align-items:center; gap:8px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:9px 14px; box-shadow:var(--shadow);}
  .date-btn .d-main{font-size:16px; font-weight:700; color:var(--text);}
  .date-btn .d-sub{font-size:11px; color:var(--muted); margin-top:1px;}
  .nav{width:38px; height:38px; border-radius:50%; background:var(--card); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; color:var(--ink);}
  .nav:active{transform:scale(.94);}
  .today-btn{background:var(--sun); color:#fff; border-radius:14px; padding:0 14px; height:38px; font-size:13px; font-weight:700; display:none; align-items:center;}
  .today-btn.show{display:flex;}
  .today-btn:active{filter:brightness(.95);}

  .content{padding:6px 14px 18px;}

  /* ===== 卡片 ===== */
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px; margin-bottom:10px;}
  .card-h{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .book-set{width:28px; height:28px; flex:0 0 28px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center; color:var(--muted); border:1.5px solid var(--line); background:#fcfaf5; margin-left:8px; cursor:pointer;}
  .book-set:active{transform:scale(.96);}
  .book-set.on{color:#fff; background:var(--sun); border-color:var(--sun);}
  .card-count{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap;}
  .todo-acts .acts-edit{display:none; align-items:center; gap:6px;}
  .card.editing .todo-acts .acts-edit{display:inline-flex;}
  .subj-dot{width:12px; height:12px; border-radius:4px;}
  .subj-语文{background:#C25B5B;} .subj-数学{background:#3F6FB0;} .subj-英语{background:#C2953B;} .subj-其他{background:#6B8E5A;}
  .subj-title{font-size:15px; font-weight:800;}
  .subj-title.语文{color:#C25B5B;} .subj-title.数学{color:#3F6FB0;} .subj-title.英语{color:#C2953B;} .subj-title.其他{color:#6B8E5A;}

  /* 作业条目（折叠） */
  .todo{position:relative; border-bottom:1px solid var(--line);}
  .todo:last-child{border-bottom:none;}
  .todo-top{display:flex; align-items:flex-start; gap:12px; padding:10px 2px; cursor:pointer;}
  .chk{width:26px; height:26px; flex:0 0 26px; border-radius:50%; border:2px solid var(--gray); display:flex; align-items:center; justify-content:center; color:#fff; transition:.2s; margin-top:1px;}
  .chk.done{background:var(--green); border-color:var(--green);}
  .chk:active{transform:scale(.9);}
  .todo-mid{flex:1 1 auto; min-width:0;}
  .todo-title{font-size:15.5px; font-weight:600; line-height:1.35; word-break:break-word;}
  .makeup-badge{display:inline-block; margin-left:7px; font-size:11px; font-weight:800; color:#fff; background:var(--sun); border-radius:6px; padding:1px 6px; line-height:15px; vertical-align:middle;}
  .corr{display:inline-block; padding:1px 7px; font-size:11px; font-weight:700; border-radius:6px; cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;}
  .corr:not(.done){color:var(--sun); border:1.5px solid var(--sun); background:rgba(232,133,59,.08);}
  .corr.done{color:#fff; background:var(--green); border:1.5px solid var(--green);}
  .corr-toggle{width:100%; padding:10px; border-radius:10px; border:1.5px solid var(--sun); background:rgba(232,133,59,.06); color:var(--sun); font-size:13.5px; font-weight:700; cursor:pointer; text-align:center; -webkit-tap-highlight-color:transparent;}
  .corr-toggle.on{background:var(--green); border-color:var(--green); color:#fff;}
  .todo-title.done{text-decoration:line-through; color:var(--muted);}
  .todo-meta{display:flex; align-items:center; gap:10px; margin-top:5px; font-size:12px; color:var(--muted); flex-wrap:wrap;}
  .pulse{width:8px; height:8px; border-radius:50%; background:var(--sun); box-shadow:0 0 0 0 rgba(232,133,59,.6); animation:pulse 1.2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,133,59,.55);}70%{box-shadow:0 0 0 9px rgba(232,133,59,0);}100%{box-shadow:0 0 0 0 rgba(232,133,59,0);}}
  .arrow{width:30px; height:30px; flex:0 0 30px; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:transform .25s; border-radius:8px;}
  .arrow.open{transform:rotate(90deg); color:var(--ink);}
  .todo-acts{display:flex; align-items:center; gap:4px; margin-left:2px; flex:0 0 auto;}
  .mini-btn{width:30px; height:30px; flex:0 0 30px; border-radius:9px; display:flex; align-items:center; justify-content:center; color:var(--muted); border:1.5px solid var(--line); background:#fcfaf5;}
  .mini-btn:active{background:var(--ink-soft);}
  .mini-btn.del{color:var(--red); border-color:#f0d3cf;}
  .mini-btn.dis{opacity:.45; pointer-events:none; filter:grayscale(.3);}
  .mini-btn.lock{font-size:13px; font-weight:800; color:var(--muted);}
  .mini-btn.lock.on{color:#fff; background:var(--sun); border-color:var(--sun);}
  .mini-btn.lock.week.on{background:#7a8cff; border-color:#7a8cff;}
  .add-est{width:62px; flex:0 0 62px; min-width:0; border:1.5px solid var(--line); border-radius:12px; padding:0 8px; font-size:14px; background:#fcfaf5; color:var(--text); text-align:center;}
  .day-summary{display:flex; align-items:center; gap:12px; padding:10px 14px; margin-bottom:12px; background:linear-gradient(135deg,#fff7e6,#fdeecb); border:1.5px solid #f1e0b8; border-radius:16px;}
  .day-summary .ds-main{display:flex; flex-direction:column; gap:3px; width:100%;}
  .day-summary .ds-t{font-size:12px; color:#9a7b3a; font-weight:600;}
  .day-summary .ds-row{display:flex; align-items:center; justify-content:space-between; white-space:nowrap; gap:6px;}
  .day-summary .ds-labels span{flex:1; text-align:center; font-size:11px; color:#9a7b3a; font-weight:600;}
  .day-summary .ds-vals b{flex:1; text-align:center; font-size:15px; font-weight:800; line-height:1.1;}
  .day-summary .ds-v{color:#7a5e1e;}
  .day-summary .ds-v2{color:var(--red);}
  .day-summary .ds-v3{color:#2e9e6b;}
  .day-summary .ds-note{font-size:11px; color:#9a7b3a; text-align:right;}
  .day-summary .ds-n{margin-left:auto; font-size:12.5px; color:#9a7b3a; text-align:right;}
  .top-stats{display:flex; background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:10px;}
  .top-stats .ts-cell{flex:1; text-align:center; padding:11px 4px; border-right:1px solid var(--line);}
  .top-stats .ts-cell:last-child{border-right:none;}
  .top-stats .ts-v{font-size:21px; font-weight:800; color:var(--ink); line-height:1; font-variant-numeric:tabular-nums;}
  .top-stats .ts-v small{font-size:11px; font-weight:600; color:var(--muted); margin-left:1px;}
  .top-stats .ts-v.g{color:var(--green);}
  .top-stats .ts-v.s{color:var(--sun);}
  .top-stats .ts-v.warn{color:var(--sun);}
  .top-stats .ts-k{font-size:11.5px; color:var(--muted); margin-top:5px; font-weight:600;}
  .upbar{position:fixed; left:50%; transform:translateX(-50%) translateY(24px); bottom:22px; z-index:9999; display:none; align-items:center; gap:10px; padding:10px 16px; border-radius:999px; background:#2f3a56; color:#fff; box-shadow:0 8px 26px rgba(0,0,0,.28); cursor:pointer; transition:transform .25s ease, opacity .25s ease; opacity:0;}
  .upbar.show{display:flex; transform:translateX(-50%) translateY(0); opacity:1;}
  .upbar .upbar-t{font-size:13px; font-weight:700;}
  .upbar .upbar-b{font-size:12px; padding:4px 12px; border-radius:999px; background:var(--sun); color:#6a4f13; font-weight:800;}
  .done-sep{margin:6px 0 2px; border-top:1px solid var(--line);}
  .expo{display:none; padding:10px 0 8px 38px; margin-top:2px; border-top:1px dashed var(--line);}
  .expo.open{display:block; animation:expoIn .22s ease;}
  @keyframes expoIn{from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;}}
  .field{display:flex; flex-direction:column; gap:6px; margin:14px 0 0;}
  .field:first-of-type{margin-top:0;}
  .field label{font-size:13px; color:var(--muted); font-weight:600;}
  .field .val{font-size:14px; color:var(--text); flex:1; line-height:1.5;}
  .field textarea,.field input{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; background:#fcfaf5; resize:none; color:var(--text);}
  .field textarea{min-height:68px;}
  .est-row{display:flex; align-items:center; gap:8px; width:100%;}
  .est-row input{flex:1; min-width:80px; text-align:left; font-size:15px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; background:#fcfaf5;}
  .field-row{display:flex; gap:12px; margin-top:14px;}
  .field-row .field{flex:1; margin-top:0;}
  .dur-line{display:flex; align-items:baseline; gap:8px; margin-top:2px;}
  .dur-hint{font-size:13px; color:var(--muted);}
  .u{color:var(--muted); font-size:13px; margin-left:2px;}
  .timer-block{margin-top:14px;}
  .timer-status{font-size:13px; font-weight:800; padding:3px 10px; border-radius:999px;}
  .timer-status.run{background:var(--sun-soft); color:var(--sun);}
  .timer-status.pause{background:#efeae0; color:var(--muted);}
  .timer-status.stop{background:#e3f3ea; color:var(--green);}
  .timer-actions{display:flex; gap:10px; margin-top:12px;}
  .timer-actions .tbtn{flex:1; justify-content:center; padding:13px 8px; font-size:14px; border-radius:14px;}
  .timer-num{font-size:28px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:1px; line-height:1;}
  .tbtn{border-radius:12px; padding:10px 16px; font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:6px;}
  .tbtn.start{background:var(--ink); color:#fff;}
  .tbtn.pause{background:var(--sun); color:#fff;}
  .tbtn.done{background:var(--green); color:#fff;}
  .tbtn.dis{opacity:.4; pointer-events:none; filter:grayscale(.3);}
  .tbtn:active{transform:scale(.96);}

  /* 盖章动效 */
  .stamp{position:absolute; right:14px; top:8px; color:var(--green); font-size:13px; font-weight:800; border:2px solid var(--green); border-radius:8px; padding:2px 8px; transform:rotate(-12deg) scale(0); opacity:0; pointer-events:none;}
  .stamp.go{animation:stamp .5s cubic-bezier(.2,1.4,.4,1) forwards;}
  @keyframes stamp{0%{transform:rotate(-12deg) scale(1.8); opacity:0;}60%{opacity:1;}100%{transform:rotate(-12deg) scale(1); opacity:1;}}

  /* 添加作业统一卡 */
  .add-title{font-size:15px; font-weight:800; color:var(--ink); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .seg4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px;}
  .seg4 button{padding:10px 0; border-radius:12px; background:#f1ece1; color:#6b655b; font-size:13.5px; font-weight:700; border:1.5px solid transparent;}
  .seg4 button.on{color:#fff; background:var(--ink);}
  .seg4 button.on[data-s="语文"]{background:#C25B5B;}
  .seg4 button.on[data-s="数学"]{background:#3F6FB0;}
  .seg4 button.on[data-s="英语"]{background:#C2953B;}
  .seg4 button.on[data-s="其他"]{background:#6B8E5A;}
  .add-row{display:flex; gap:8px;}
  .add-row input{flex:1; border:1.5px solid var(--line); border-radius:12px; padding:11px 13px; font-size:16px; background:#fcfaf5;}
  .add-row .plus{width:46px; height:46px; border-radius:12px; background:var(--sun); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; flex:0 0 46px;}
  .add-row .plus:active{transform:scale(.94);}
  /* ===== 高频词 / 常用词（按科目分组） ===== */
  .hw-wrap{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px;}
  .hw-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .hw-label{font-size:12.5px; color:var(--muted); font-weight:700;}
  .hw-add{font-size:12.5px; font-weight:700; color:var(--sun); background:#fff6e6; border:1px solid #f0d9a8; border-radius:10px; padding:4px 10px;}
  .hw-add:active{transform:scale(.96);}
  .hw-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .hw-chip{display:inline-flex; align-items:center; gap:3px; background:#f4efe4; border:1px solid var(--line); border-radius:999px; padding:6px 8px 6px 12px; font-size:13.5px; color:var(--ink); font-weight:600; cursor:pointer;}
  .hw-chip:active{transform:scale(.97);}
  .hw-edit,.hw-del{font-style:normal; font-size:11px; width:18px; height:18px; line-height:18px; text-align:center; border-radius:50%; cursor:pointer;}
  .hw-edit{color:#8a7d5a; background:#efe7d2;}
  .hw-del{color:#fff; background:#c97b7b; margin-left:2px;}
  .hw-empty{font-size:12px; color:var(--muted);}
  .hw-est{font-size:11px; color:#8a7d5a; background:#ece3cf; border-radius:999px; padding:1px 6px; margin-left:2px; font-weight:700;}

  /* ===== 待办事项 ===== */
  .task-add{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .task-add .seg3{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px;}
  .seg3 button{padding:9px 0; border-radius:12px; background:#f1ece1; color:#6b655b; font-size:13.5px; font-weight:700; border:1.5px solid transparent;}
  .seg3 button.on[data-p="1"]{background:#C0392B; color:#fff;}
  .seg3 button.on[data-p="2"]{background:#E8853B; color:#fff;}
  .seg3 button.on[data-p="3"]{background:#6B8E5A; color:#fff;}
  .due-btn{display:inline-flex; align-items:center; gap:6px; background:#f1ece1; border-radius:12px; padding:9px 12px; font-size:13px; font-weight:600; color:#6b655b; margin-bottom:10px;}
  .due-btn.set{background:var(--ink-soft); color:var(--ink);}
  .task-sec{font-size:12px; color:var(--muted); font-weight:800; margin:14px 4px 6px; letter-spacing:.5px;}
  .task-row{display:flex; align-items:flex-start; gap:12px; padding:13px 12px; background:var(--card); border-bottom:1px solid var(--line);}
  .task-row:last-child{border-bottom:none;}
  .task-row .chk{margin-top:1px;}
  .task-main{flex:1 1 auto; min-width:0;}
  .task-title{font-size:15.5px; font-weight:600; line-height:1.4; word-break:break-word;}
  .task-row.done .task-title{text-decoration:line-through; color:var(--muted);}
  .task-row.done{opacity:.72;}
  .task-meta{display:flex; align-items:center; gap:8px; margin-top:7px; flex-wrap:wrap;}
  .pri{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700;}
  .pri .dot{width:7px; height:7px; border-radius:50%;}
  .pri-1{background:#fbe2dd; color:#b3402f;} .pri-1 .dot{background:#C0392B;}
  .pri-2{background:#fbe9d8; color:#a85f23;} .pri-2 .dot{background:#E8853B;}
  .pri-3{background:#e9efe9; color:#3E7A69;} .pri-3 .dot{background:#6B8E5A;}
  .task-due{font-size:11.5px; color:var(--muted);}
  .task-due.over{color:#b3402f; font-weight:700;}
  .task-del{width:30px; height:30px; flex:0 0 30px; display:flex; align-items:center; justify-content:center; color:var(--muted); border-radius:8px;}
  .task-del:active{background:#f1ece1;}

  /* ===== 作业统计 甘特 ===== */
  .gantt{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
  .gantt-axis{position:relative; height:18px; margin:0 4px 8px; font-size:10px; color:var(--muted);}
  .gantt-axis .tick{position:absolute; top:0; transform:translateX(-50%);}
  .gantt-track{position:relative; height:34px; background:#f4efe4; border-radius:9px; margin:0 4px;}
  .gblock{position:absolute; top:3px; height:14px; border-radius:7px; display:flex; align-items:center; padding:0; font-size:0; font-weight:700; color:#fff; overflow:hidden; white-space:nowrap; cursor:pointer; transition:left .9s linear, width .9s linear, opacity .18s, filter .18s; box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .gblock.g-none{opacity:.42; outline:1.5px dashed rgba(255,255,255,.85); outline-offset:-3px;}
  .gblock.g-run{box-shadow:0 0 0 3px rgba(255,255,255,.7); animation:gpulse 1.2s infinite;}
  @keyframes gpulse{0%{box-shadow:0 0 0 2px rgba(255,255,255,.5);}70%{box-shadow:0 0 0 7px rgba(255,255,255,0);}100%{box-shadow:0 0 0 2px rgba(255,255,255,0);}}
  /* 选中：自身加深、其余变浅，不套框 */
  .gantt.has-hl .gblock{opacity:.4;}
  .gantt.has-hl .gblock.hl{opacity:1;}
  .gblock.hl{filter:brightness(.82) saturate(1.15);}
  .glegend{display:flex; gap:14px; font-size:11px; color:var(--muted); margin:6px 6px 0;}
  .glegend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  /* 自适应多段时间轴（按时间空隙分段：上午/下午/晚上） */
  .gantt-row{margin-bottom:13px;}
  .gantt-row:last-of-type{margin-bottom:2px;}
  .grow-hd{display:flex; align-items:center; gap:8px; margin:0 4px 6px;}
  .grow-tag{font-size:11.5px; font-weight:800; color:#fff; background:var(--ink); border-radius:7px; padding:3px 9px; flex:0 0 auto;}
  .grow-tag.上午{background:#6B8E5A;}
  .grow-tag.下午{background:#E8853B;}
  .grow-tag.晚上{background:#3F6FB0;}
  .grow-tag.未开始{background:#9A948A;}
  .grow-range{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .gantt-track.static{display:flex; gap:5px; align-items:center; height:18px;}
  .gantt-track.static .gblock{position:static; flex:0 0 auto; min-width:14px; height:14px;}
  .detail-line{font-size:13.5px; color:var(--text); line-height:1.6; padding:10px 4px; border-top:1px dashed var(--line);}
  .detail-line b{color:var(--ink);}
  .srow{padding:9px 4px; border-top:1px solid var(--line);}
  .srow:first-child{border-top:none;}
  .srow{transition:opacity .18s;}
  .srow.hl{background:var(--sun-soft); border-radius:10px;}
  .card.has-hl .srow{opacity:.42;}
  .card.has-hl .srow.hl{opacity:1;}
  .srow-top{display:flex; align-items:center; gap:8px;}
  .srow-title{font-size:14px; font-weight:700; color:var(--text); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .srow-est{font-size:11.5px; color:var(--muted); flex:0 0 auto;}
  .srow-sub{display:flex; gap:10px; margin-top:4px; font-size:11.5px; color:var(--muted); flex-wrap:wrap;}
  .srow-sub b{color:var(--ink); font-weight:700;}

  /* ===== 合计栏（周/月 作业完成情况汇总） ===== */
  .sum-range{display:flex; gap:8px; margin-top:10px;}
  .sum-range button{flex:1; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:10px 0; font-size:15px; font-weight:700; color:var(--muted); box-shadow:var(--shadow);}
  .sum-range button.on{background:var(--sun); color:#fff; border-color:var(--sun);}
  .rate-big{background:linear-gradient(135deg,#4f9d6b,#3F6FB0); border-radius:16px; padding:16px; color:#fff; box-shadow:var(--shadow); margin-bottom:12px;}
  .rate-big .rt{font-size:38px; font-weight:800; line-height:1;}
  .rate-big .rl{font-size:13px; opacity:.9; margin-top:6px;}
  .rate-big .rsub{font-size:12.5px; opacity:.92; margin-top:8px;}
  /* 比较：每小项作业一览（科目=卡片底色区分；名称与数据同一行；紧凑） */
  .cmpt{background:var(--card); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; margin-top:6px; padding-bottom:4px;}
  .cmpt-head{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; font-size:12px; color:var(--muted); font-weight:700; border-bottom:1px solid #efe9dc;}
  .cmpt-head .cnt{color:var(--ink);}
  .cmpt-colhead{display:flex; align-items:center; gap:8px; padding:5px 12px 4px; background:#fbf9f4; border-bottom:1px solid #f2efe6;}
  .cmpt-colhead .lh{flex:1; min-width:0; font-size:10.5px; color:var(--muted); font-weight:700;}
  .cmpt-colhead .hg{flex:0 0 204px; display:grid; grid-template-columns:repeat(4,1fr); gap:4px;}
  .cmpt-colhead .ch{font-size:10.5px; color:var(--muted); text-align:center; cursor:pointer; user-select:none; padding:3px 2px; border-radius:8px; transition:background .12s;}
  .cmpt-colhead .ch:hover{background:#f0ece2;}
  .cmpt-colhead .ch.on{color:var(--ink); font-weight:800; background:#ece5d6;}
  .cmpt-colhead .ch .ar{font-size:8.5px; margin-left:1px;}
  .cmpt-row{display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:11px; margin:4px 8px;}
  .cmpt-row .top{display:flex; align-items:center; gap:6px; flex:1; min-width:0;}
  .cmpt-row .sb{font-size:10.5px; font-weight:700; background:#fff; border:1px solid; border-radius:7px; padding:1px 6px; flex:0 0 auto; max-width:52px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cmpt-row .tt{flex:1; min-width:0; font-size:12.5px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cmpt-row .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; flex:0 0 204px;}
  .cmpt-row .stat{text-align:center;}
  .cmpt-row .stat .v{font-size:13.5px; font-weight:800; color:var(--ink); line-height:1.05;}
  .cmpt-row .stat .v i{font-size:9.5px; font-style:normal; color:var(--muted); font-weight:600; margin-left:1px;}
  .mode-pc #page-summary .rate-big,
  .mode-pc #page-summary .cmpt{max-width:1080px; margin-left:auto; margin-right:auto;}
  .mode-pc #page-summary .rate-big{margin-bottom:12px;}
  .sum-year-note{text-align:center; font-size:13px; color:var(--muted); padding:9px 0; background:var(--card); border-radius:14px; box-shadow:var(--shadow); margin-top:6px;}
  .sum-hint{text-align:center; font-size:11px; color:var(--muted); margin-top:8px;}
  .cal-cell.wkpick{cursor:pointer;}
  .mode-pc #page-summary .cal{max-width:1080px; margin:0 auto;}

  /* ===== 月度统计 ===== */
  .kpi{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-bottom:12px;}
  .kpi-cell{background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:11px 6px; text-align:center;}
  .kpi-cell .v{font-size:20px; font-weight:800; color:var(--ink); line-height:1.1;}
  .kpi-cell .v.g{color:var(--green);}
  .kpi-cell .v.warn{color:var(--sun);}
  .kpi-cell .k{font-size:10.5px; color:var(--muted); margin-top:4px;}
  .cal{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--muted); padding:4px 0; font-weight:600;}
  .cal-cell{aspect-ratio:1/1; border-radius:10px; background:#f6f2e9; display:flex; flex-direction:column; align-items:center; justify-content:center; position:relative; font-size:13px; color:#5b564c;}
  .cal-cell.today{outline:2px solid var(--ink); outline-offset:-2px;}
  .cal-cell.empty{background:transparent;}
  .cal-cell .stars{font-size:9px; color:var(--sun); margin-top:1px; line-height:1; letter-spacing:1px;}
  .cal-cell .s0{color:var(--muted);}
  .cal-cell.future{opacity:.4; cursor:default;}
  .cal-toggle{display:flex; align-items:center; justify-content:space-between; background:var(--card); border-radius:14px; box-shadow:var(--shadow); padding:11px 14px; margin-top:8px; cursor:pointer; user-select:none;}
  .cal-toggle .t{font-size:14px; font-weight:700; color:var(--ink);}
  .cal-toggle .caret{color:var(--muted); font-size:13px; transition:transform .15s;}
  .mode-pc #page-summary .cal-toggle{max-width:1080px; margin-left:auto; margin-right:auto;}
  .month-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .legend-row{display:flex; gap:12px; font-size:11px; color:var(--muted); margin-top:10px; flex-wrap:wrap;}
  .legend-row i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:4px; vertical-align:-1px; background:var(--sun);}
  .month-note{ font-size:11.5px; color:var(--muted); margin-top:8px; padding:7px 10px; background:var(--card); border-radius:10px; text-align:center; box-shadow:var(--shadow); }

  .empty-tip{text-align:center; color:var(--muted); font-size:13px; padding:30px 0;}

  /* ===== 底部 Tab ===== */
  .home-bar{height:var(--sab); flex:0 0 auto; background:var(--paper); position:relative;}
  .home-bar::after{content:""; position:absolute; left:50%; bottom:8px; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#1c1c1e; opacity:.85;}
  .tabbar{flex:0 0 auto; display:flex; background:var(--paper); border-top:1px solid var(--line); padding:6px 0 2px;}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:4px 0; color:var(--muted);}
  .tab.on{color:var(--ink);}
  .tab .ic{width:26px; height:26px; display:flex; align-items:center; justify-content:center;}
  .tab .lb{font-size:10.5px; font-weight:600;}
  .tabbar .brand{display:none;}

  /* ===== 底部弹层 ===== */
  .mask{position:absolute; inset:0; background:rgba(20,25,30,.42); z-index:80; display:none; opacity:0; transition:opacity .25s;}
  .mask.show{display:block; opacity:1;}
  .sheet{position:absolute; left:0; right:0; bottom:0; background:var(--paper); border-radius:22px 22px 0 0; z-index:81; transform:translateY(100%); transition:transform .3s cubic-bezier(.2,.8,.2,1); padding:14px 16px calc(22px + var(--sab)); max-height:86%; overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet-h{font-size:17px; font-weight:800; color:var(--ink); text-align:center; margin:4px 0 14px; position:relative;}
  .sheet-h .close{position:absolute; right:0; top:-2px; width:34px; height:34px; color:var(--muted); display:flex; align-items:center; justify-content:center; border-radius:10px;}
  .opt{display:flex; align-items:center; justify-content:space-between; padding:14px 14px; background:var(--card); border-radius:14px; margin-bottom:9px; font-size:15px; font-weight:600; box-shadow:var(--shadow);}
  .opt:active{background:#f1ece1;}
  .opt .sub{font-size:12px; color:var(--muted); font-weight:500;}
  .opt.danger{color:var(--red);}

  /* 云同步（GitHub Gist）面板 */
  .sync-box{background:var(--card); border-radius:14px; padding:14px; margin-bottom:9px; box-shadow:var(--shadow);}
  .sync-box .sync-h{display:flex; align-items:center; gap:6px; font-size:15px; font-weight:800; color:var(--ink); margin-bottom:4px;}
  .sync-box .sync-note{font-size:12px; color:var(--muted); line-height:1.5; margin:0 0 10px;}
  .sync-box .fld{margin-bottom:9px;}
  .sync-box label{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .sync-box input{flex:1; width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; background:#fcfaf5;}
  .sync-box .btns{display:flex; gap:8px; margin-top:4px;}
  .sync-box .sbtn{flex:1; padding:11px 0; border-radius:12px; border:none; font-size:14px; font-weight:800; color:#fff; background:var(--ink);}
  .sync-box .sbtn.alt{background:#6B8E5A;}
  .sync-box .sbtn:active{transform:scale(.97);}
  .sync-box .sbtn:disabled{opacity:.5;}
  .sync-status{font-size:12.5px; margin-top:9px; min-height:16px; color:var(--muted);}
  .sync-status.ok{color:var(--green);}
  .sync-status.err{color:var(--red);}

  /* 日期选择网格 */
  .dp-nav{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .dp-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .dp-dow{text-align:center; font-size:11px; color:var(--muted); padding:4px 0;}
  .dp-cell{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:14px; color:var(--text);}
  .dp-cell.empty{visibility:hidden;}
  .dp-cell.sel{background:var(--ink); color:#fff; font-weight:700;}
  .dp-cell.today{outline:2px solid var(--sun); outline-offset:-2px;}

  /* 长按清空进度 */
  .hold{border-radius:14px; padding:14px; background:#fbeae6; color:var(--red); font-weight:700; text-align:center; font-size:14px; position:relative; overflow:hidden; user-select:none;}
  .hold .fill{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--red); opacity:.16;}
  .hold.go{background:#f6d9d2;}

  .toast{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9); background:rgba(20,25,30,.9); color:#fff; padding:12px 18px; border-radius:14px; font-size:14px; z-index:90; opacity:0; transition:.2s; pointer-events:none; max-width:80%; text-align:center;}
  .toast.show{opacity:1; transform:translate(-50%,-50%) scale(1);}

  /* 真机（无外框）下隐藏桌面预览元素 */
  .app-root.real .phone-bezel-hint{display:none;}
  @media (max-width:479px){
    body{background:var(--paper);}
    .stage{padding:0; min-height:100vh;}
    .modebar{display:none;}
    .phone{width:100%!important; height:100vh!important; border-radius:0; padding:0; box-shadow:none; background:var(--paper);}
    .phone::before,.phone::after{display:none;}
    .screen{border-radius:0;}
  }
  /* 登录 / 注册 */
  .login-screen{position:fixed; inset:0; z-index:200; background:linear-gradient(160deg,#2f5d50,#3f6fb0); display:flex; align-items:center; justify-content:center; padding:24px;}
  .login-card{width:100%; max-width:340px; background:#fff; border-radius:22px; padding:26px 22px; box-shadow:0 18px 50px rgba(0,0,0,.28);}
  .login-card h2{margin:0 0 4px; font-size:22px; color:var(--ink);}
  .login-card .sub{margin:0 0 18px; font-size:13px; color:var(--muted);}
  .login-card .lfld{margin-bottom:12px;}
  .login-card .lfld label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px;}
  .login-card .lfld input{width:100%; box-sizing:border-box; padding:12px 13px; border:1.5px solid #e3ddd0; border-radius:12px; font-size:15px; outline:none;}
  .login-card .lfld input:focus{border-color:var(--ink);}
  .login-card .lbtn{width:100%; margin-top:6px; padding:13px; border:none; border-radius:12px; background:var(--ink); color:#fff; font-size:16px; font-weight:700; cursor:pointer;}
  .login-card .lbtn:active{opacity:.85;}
  .login-card .lbtn[disabled]{opacity:.6;}
  .login-card .link{margin-top:14px; text-align:center; font-size:13px; color:var(--ink); cursor:pointer; user-select:none;}
  .login-card .err{color:var(--red); font-size:12.5px; min-height:16px; margin-top:8px; text-align:center;}
  .login-card .row2{display:flex; gap:10px;}
  .login-card .row2 .lbtn{flex:1;}
  .login-card .ghost{background:#eef2f4;}
  .login-card .who{font-size:13px; color:var(--muted); margin-bottom:14px;}
  .pull-hint{position:absolute; left:0; right:0; top:0; height:0; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:13px; font-weight:600; background:rgba(255,255,255,.6); transition:height .15s; pointer-events:none; z-index:60;}
</style>
</head>
<body>
<!-- 登录 / 注册 -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h2 id="loginTitle">作业台 · 登录</h2>
    <p class="sub" id="loginSub">登录后自动云端同步，多端数据互联</p>
    <div id="loginForm">
      <div class="lfld"><label>账号</label><input id="loginUser" placeholder="例如 lvcheng" autocomplete="username" value="lvcheng"></div>
      <div class="lfld"><label>密码</label><input id="loginPw" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <div class="lfld"><label>云端 Token</label><input id="loginToken" type="password" placeholder="粘贴你的 GitHub 个人访问令牌（Token）" autocomplete="off"></div>
      <button class="lbtn" id="loginBtn" onclick="doLogin()">登录</button>
      <div class="err" id="loginErr"></div>
      <div class="link" onclick="showRegister()">没有账号？注册新账号</div>
    </div>
    <div id="regForm" style="display:none;">
      <div class="lfld"><label>新账号名</label><input id="regUser" placeholder="自定义账号名"></div>
      <div class="lfld"><label>密码（至少 4 位）</label><input id="regPw" type="password" placeholder="设置密码"></div>
      <div class="lfld"><label>确认密码</label><input id="regPw2" type="password" placeholder="再次输入密码"></div>
      <div class="lfld"><label>云端 Token</label><input id="regToken" type="password" placeholder="粘贴你的 GitHub 个人访问令牌（Token）" autocomplete="off"></div>
      <button class="lbtn" id="regBtn" onclick="doRegister()">注册并登录</button>
      <div class="err" id="regErr"></div>

<script>
"use strict";
/* ============ 常量 ============ */
const STORE_KEY = "wb_hwdsk_v1";
const SUBJECTS = ["语文","数学","英语","其他"];
const INK = "#2F5D50", SUN = "#E8853B", GREEN="#3FA46A", GRAY="#C9C3B6", RED="#C0392B";
const SUBJ_COLOR = {"语文":"#C25B5B","数学":"#3F6FB0","英语":"#C2953B","其他":"#6B8E5A"};

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const pad2 = n => (n<10?"0":"")+n;
const ymd = d => d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const parseYmd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const clockToMin = s => { if(!s) return null; const [h,m]=s.split(":").map(Number); return h*60+m; };
const minToClock = m => { m=((m%1440)+1440)%1440; return pad2(Math.floor(m/60))+":"+pad2(m%60); };
const sameDay = (a,b)=> a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const WEEK = ["周日","周一","周二","周三","周四","周五","周六"];
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ============ 状态 ============ */
let state = null;
let viewDate = new Date(); viewDate.setHours(0,0,0,0);
let monthView = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
let cmpTitle = null;
let openExpo = null;      // 当前展开的 todoId（手风琴：同时只展开一个）
let ganttHL = null;      // 高亮 todoId

/* ============ 数据层 ============ */
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ state = JSON.parse(raw); } }catch(e){}
  if(!state || !state.todos){ state = seed(); save(); }
  if(!state.tasks){ state.tasks = []; }
  if(!state._del){ state._del = {}; }        // 删除墓碑：防止已删条目被云端“复活”
  if(!Array.isArray(state.masters)) state.masters = [];   // 循环锁定母版（每日/每周）
  if(!state._delM) state._delM = {};          // 母版删除墓碑：跨端同步停止循环
  if(!state.hw) state.hw = {};                // 常用词（按科目分组）：随作业清单一起多端同步
  if(!state._delHW) state._delHW = {};        // 常用词删除墓碑：跨端同步删除
  /* 迁移：旧版常用词存于独立 localStorage 键 wb_hwdsk_hw_v1，并入 state.hw 一并同步 */
  try{
    const oldHW = JSON.parse(localStorage.getItem(HW_KEY)||"null");
    if(oldHW && typeof oldHW==="object"){
      Object.keys(oldHW).forEach(s=>{
        (oldHW[s]||[]).forEach(x=>{ const it=hwItem(x); (state.hw[s]=state.hw[s]||[]).push({id:uid(), t:it.t, e:it.e, _u:0}); });
      });
      localStorage.removeItem(HW_KEY); saveLocal();
    }
  }catch(e){}
  pruneTombstones();
}
/* 仅写本机，不触发云同步（供同步流程内部使用，避免递归） */
function saveLocal(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
/* 正常保存：写本机 + 若已配置云同步则延迟自动上传 */
function save(){ saveLocal(); syncSchedule(); }

function seed(){
  // 全新安装从空开始（不再生成示例数据，避免混入统计与云端）
  return { todos:[], tasks:[], masters:[], _del:{}, _delM:{}, hw:{}, _delHW:{}, _syncedAt:0 };
}
function mkTodo(date, subject, title, o={}){
  return Object.assign({
    id:uid(), date:ymd(date), subject, title,
    detail:"", estMin:0, wrong:0, done:false,
    makeup:false, completedOn:null, dinged:false, corrected:false,   // 补打卡标记 / 实际完成日 / 预估时间已提示 / 订正是否完成
    accum:0, timerRunning:false, startedAt:null,
    startClock:null, endClock:null,
    segments:[],           // 每次「开始–暂停」一段：{s:"HH:MM", e:"HH:MM"|null}
    masterId:null,         // 循环锁定：指向 state.masters 的母版 id；空=一次性作业
    lock:null,             // 本条目循环类型：'daily' | 'weekly' | null
    _u: Date.now()         // 本条最后修改时间（多端合并时以新的为准）
  }, o);
}
/* 标记为「本机已改动」，供云端合并判定谁更新 */
function touch(t){ if(t) t._u = Date.now(); return t; }

/* ============ 计时分段（暂停即分段） ============ */
function nowClock(){ const d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function segOpen(t, clock){ const a=(t.segments=t.segments||[]); if(!a.length || a[a.length-1].e!=null) a.push({s:clock, e:null}); }
function segClose(t, clock){ const a=(t.segments=t.segments||[]); const last=a[a.length-1]; if(last && last.e==null) last.e=clock; }
/* 展示用：有真实分段用真实分段，否则用 起止 兜底（兼容旧数据） */
function segmentsOf(t){
  const arr=(t.segments||[]).filter(x=>x.s);
  let list;
  if(arr.length) list = arr.map(x=>({s:x.s, e: x.e || (t.timerRunning?"进行中":x.s)}));
  else {
    // 无分段：用「计时开始 + 计时器实际用时」；从未计时则不显示时间段
    const sm=clockToMin(t.startClock), dur=Math.round(spentOf(t)/60000);
    if(sm==null || dur<=0) return [];
    list=[{s:t.startClock, e: t.timerRunning ? "进行中" : minToClock(sm+dur)}];
  }
  if(list.length<2) return list;
  // 相邻段暂停 <GAP_MERGE 分钟 → 合并为一段（与色块一致）
  const merged=[];
  list.forEach(seg=>{
    const last=merged[merged.length-1];
    if(last && last.e!=="进行中"){
      const ge=clockToMin(last.e), gs=clockToMin(seg.s);
      if(gs!=null && ge!=null && (gs-ge)<=GAP_MERGE){ last.e=seg.e; return; }
    }
    merged.push({s:seg.s, e:seg.e});
  });
  return merged;
}
function segText(t){
  const segs=segmentsOf(t);
  return segs.length ? segs.map(x=> x.s+"–"+x.e).join("、") : "未开始";
}
function addTodo(subject, title, opts={}){
  const t = mkTodo(viewDate, subject, title, opts);
  state.todos.push(t); save(); syncDerived(); return t;
}
function getTodo(id){ return state.todos.find(t=>t.id===id); }

/* ============ 待办事项（独立于作业数据，不进任何统计） ============ */
const PRI = {1:{label:"高",cls:"pri-1"},2:{label:"中",cls:"pri-2"},3:{label:"低",cls:"pri-3"}};
const TASK_KEEP = 10;                 // 已完成最多保留
let addPri = 2, addDue = null;        // 添加卡草稿
function mkTask(title, due, priority){
  return { id:uid(), title, due: due||null, priority: priority||2, done:false, doneAt:null, createdAt:Date.now(), _u: Date.now() };
}
function addTask(title, due, priority){
  title=(title||"").trim(); if(!title) return null;
  const t = mkTask(title, due, priority);
  state.tasks.push(t); save(); renderTasks(); return t;
}
function getTask(id){ return state.tasks.find(t=>t.id===id); }
function toggleTask(id){
  const t=getTask(id); if(!t) return;
  t.done=!t.done; touch(t);
  if(t.done){ t.doneAt=Date.now(); pruneTasks(); toast("待办已完成 · 已下沉"); }
  else { t.doneAt=null; toast("已恢复为未完成"); }
  save(); renderTasks();
}
function delTask(id){       // 仅未完成可删除（已完成由数量上限自动清理）
  const t=getTask(id); if(!t || t.done) return;
  tombstone(id);
  state.tasks = state.tasks.filter(x=>x.id!==id); save(); renderTasks(); toast("已删除待办");
}
/* 删除记录：写入墓碑，避免合并时又被云端数据“复活” */
function tombstone(id){
  if(!id) return;
  state._del = state._del||{};
  state._del[id] = Date.now();
}
function pruneTasks(){      // 已完成超过上限，按完成时间逐条删最旧
  const done = state.tasks.filter(t=>t.done);
  if(done.length <= TASK_KEEP) return;
  done.sort((a,b)=> (a.doneAt||0)-(b.doneAt||0));   // 旧 → 前
  const over = done.length - TASK_KEEP;
  const kill = new Set(done.slice(0, over).map(t=>t.id));
  state.tasks = state.tasks.filter(t=>!kill.has(t.id));
}
function setTaskPri(id, p){ const t=getTask(id); if(!t) return; t.priority=p; touch(t); save(); renderTasks(); }
const MAKEUP_LOCK_DAYS = 7;            // 作业逾期超过该天数仍未完成 → 禁止补打卡，仅保留未完成
/* 是否因逾期过久而锁定（不可再补打卡）：未完成 且 距作业日已超过锁定天数 */
function makeupLocked(t){
  if(!t || t.done) return false;
  const today=new Date(); today.setHours(0,0,0,0);
  const d=parseDS(t.date); if(!d) return false; d.setHours(0,0,0,0);
  const diff=Math.round((today-d)/86400000);
  return diff > MAKEUP_LOCK_DAYS;
}
const DELETE_LOCK_DAYS = 3;            // 作业日超过该天数后，禁止删除具体条目（仍可编辑状态/补打卡/改错题/订正）
/* 具体条目是否已超过删除时限：距作业日超过该天数 → 不可删除（仅限制删除，不影响其他编辑） */
function deleteLocked(t){
  if(!t) return false;
  const d=parseDS(t.date); if(!d) return false;
  const today=new Date(); today.setHours(0,0,0,0); d.setHours(0,0,0,0);
  const diff=Math.round((today-d)/86400000);
  return diff > DELETE_LOCK_DAYS;
}
/* 「补打卡」判定：仅当完成日晚于作业日才算补打卡；
   当日完成 或 提前完成（提前打卡）均视为「按时完成」，不计补打卡。
   参数为 ISO 日期串（YYYY-MM-DD），可直接字符串比较。 */
function calcMakeup(dateStr, compStr){ return !!compStr && compStr > dateStr; }
function toggleDone(id){
  const t = getTodo(id); if(!t) return;
  if(!t.done && makeupLocked(t)){ toast("该作业已逾期 "+MAKEUP_LOCK_DAYS+" 天，无法补打卡，仅保留未完成"); return; }
  t.done = !t.done; touch(t);
  if(t.done){
    // 计时中直接勾完成：先停表并闭合分段，避免后台继续虚增时长
    if(t.timerRunning){ t.accum += (Date.now()-t.startedAt); t.timerRunning=false; t.startedAt=null; segClose(t, nowClock()); }
    finalizeEnd(t, Date.now());
    const td=ymd(new Date()); t.completedOn=td; t.makeup=calcMakeup(t.date, td);   // 提前/当日完成=按时；晚于作业日才算补打卡
  }
  else { t.endClock=null; t.timerRunning=false; t.startedAt=null; t.segments=[]; t.makeup=false; t.completedOn=null; }  // 取消完成 → 清空分段重新计
  save(); syncDerived();
}
function finalizeEnd(t, now){
  const d = new Date(now);
  t.endClock = pad2(d.getHours())+":"+pad2(d.getMinutes());
  if(!t.startClock){
    const span = Math.round((t.accum||0)/60000);
    const endMin = d.getHours()*60+d.getMinutes();
    t.startClock = minToClock(endMin - span);
  }
}
function timerStart(id){
  const t=getTodo(id); if(!t) return;
  if(!t.done && makeupLocked(t)){ toast("该作业已逾期 "+MAKEUP_LOCK_DAYS+" 天，无法补打卡，仅保留未完成"); return; }
  if(t.done){ t.done=false; t.endClock=null; t.makeup=false; t.completedOn=null; }
  ensureAudio();                        // 用户点击=手势，借此解锁音频以便到点播放「叮」
  if(!t.timerRunning){
    const c=nowClock();
    t.timerRunning=true; t.startedAt=Date.now();
    if(!t.startClock){ t.startClock=c; }
    if(t.accum===0) t.dinged=false;     // 全新计时，重置「叮」提示标记
    segOpen(t, c);                      // 新开一段（暂停后再开始会再开一段）
  }
  touch(t);
  save(); afterTimer(); toast("计时已开始");
}
function timerPause(id){
  const t=getTodo(id); if(!t||!t.timerRunning) return;
  t.accum += (Date.now()-t.startedAt); t.timerRunning=false; t.startedAt=null;
  segClose(t, nowClock());              // 暂停 → 闭合当前段
  touch(t); save(); afterTimer(); toast("计时已暂停");
}
function timerDone(id){
  const t=getTodo(id); if(!t) return;
  if(!t.done && makeupLocked(t)){ toast("该作业已逾期 "+MAKEUP_LOCK_DAYS+" 天，无法补打卡，仅保留未完成"); return; }
  if(t.timerRunning){ t.accum += (Date.now()-t.startedAt); t.timerRunning=false; t.startedAt=null; segClose(t, nowClock()); }
  t.done=true; touch(t); finalizeEnd(t, Date.now());
  const td=ymd(new Date()); t.completedOn=td; t.makeup=calcMakeup(t.date, td);   // 提前/当日完成=按时；晚于作业日才算补打卡
  save();
  afterTimer(); toast("计时已停止");
}

/* ============ 计算层 ============ */
function todosOf(dateStr){ return state.todos.filter(t=>t.date===dateStr); }
function spentOf(t){ return (t.accum||0) + (t.timerRunning ? (Date.now()-t.startedAt) : 0); }
/* 计时器最后一段的结束时刻（分钟）；无计时数据返回 null —— 时间轴一律以计时器为准 */
function segLastEndMin(t){
  const a=(t.segments||[]).filter(x=>x && x.s);
  if(!a.length) return null;
  const last=a[a.length-1];
  if(last.e!=null){ const m=clockToMin(last.e); if(m!=null) return m; }
  if(t.timerRunning) return Math.floor(Date.now()/60000)%1440;
  return null;
}
/* 开始时刻：优先取计时器第一段，其次才是兜底的 startClock */
function startMinOf(t){
  const a=(t.segments||[]).filter(x=>x && x.s);
  if(a.length){ const m=clockToMin(a[0].s); if(m!=null) return m; }
  return clockToMin(t.startClock);
}
/* 结束时刻：优先计时器最后一段；运行中取当前；都没有才用「完成时间」兜底（兼容早期数据） */
function endMinOf(t){
  const m=segLastEndMin(t); if(m!=null) return m;
  if(t.timerRunning && t.startedAt) return Math.floor(Date.now()/60000)%1440;
  return clockToMin(t.endClock);
}
/* 实际用时不足 1 分钟 → 视作当时未计时，不计入任何「用时」类统计 */
const MIN_STAT_MS = 60000;
/* 实际记录时长：手动输入（manualMin）优先；未手动输入时取计时器真实累计 spentOf */
function recMs(t){ return (t && t.manualMin && t.manualMin>0) ? t.manualMin*60000 : spentOf(t); }
function isTimed(t){ return recMs(t) >= MIN_STAT_MS; }
/* 有效计时分钟数组：剔除不足 1 分钟（疑似未计时）与明显过长（>3×中位数，疑似忘记按完成） */
function validMinutes(todos){
  const ms = todos.map(t=>recMs(t)/60000).filter(m=> m>=1);
  if(ms.length<3) return ms;                       // 样本太少不剔除，避免误伤
  const s=[...ms].sort((a,b)=>a-b);
  const mid=Math.floor(s.length/2);
  const med = s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  const cap = med*3;                                // 超过 3 倍中位数视为明显过长
  return ms.filter(m=> m<=cap);
}
function dayStats(dateStr){
  const ts = todosOf(dateStr);
  const done = ts.filter(t=>t.done).length;
  const timedAll = ts.filter(isTimed);              // 仅真正计时过的进用时统计
  const valid = validMinutes(ts);
  const totalMin = Math.round(valid.reduce((s,m)=>s+m,0));
  const wrongSum = ts.reduce((s,t)=>s+(t.wrong||0),0);
  let maxEnd=null;
  ts.forEach(t=>{ const e=endMinOf(t); if(e!=null) maxEnd = maxEnd==null?e:Math.max(maxEnd,e); });
  return {ts, done, total:ts.length, totalMin, wrongSum, maxEnd,
          timedN:timedAll.length, validN:valid.length, untimedN:ts.length-timedAll.length,
          allDone: ts.length>0 && done===ts.length};
}
/* 用时展示：不足 1 分钟显示「未计时」，避免把 0 分当成真实成绩 */
function spentLabel(t){ const m=Math.round(recMs(t)/60000); return m>0 ? m+" 分" : "未计时"; }
function dayStars(dateStr){
  const s = dayStats(dateStr);
  const real = s.ts.filter(t=>!t.makeup);            // 仅计当日真实完成项，补打卡不计入
  const total = real.length;
  if(total===0) return {stars:0, allDone:false, settled:false, pending:false};
  const done = real.filter(t=>t.done).length;
  // 规则（明确）：当天若存在任何补打卡项（无论是否完成），即非「当日全部完成」→ 不记星
  if(s.ts.some(t=>t.makeup)) return {stars:0, allDone:false, settled:dateStr < ymd(new Date()), pending:false};
  if(done < total) return {stars:0, allDone:false, settled:dateStr < ymd(new Date()), pending:false};
  // 全部完成（仅计非补打卡项）：基础 1 颗星
  let stars = 1;
  const wrongSum = real.reduce((a,t)=>a+(t.wrong||0),0);
  if(wrongSum <= 5) stars++;                       // 错题 ≤5 题 → +1 星
  let maxEnd=null; real.forEach(t=>{ const e=endMinOf(t); if(e!=null) maxEnd = maxEnd==null?e:Math.max(maxEnd,e); });
  if(maxEnd != null && maxEnd < 21*60) stars++;    // 晚上 9 点前完成 → +1 星
  // 当天所有项目都通过计时器计时并完成 → 整体额外 +1 星（计时打卡奖）
  const allTimer = total>0 && real.every(t=> t.done && spentOf(t) >= MIN_STAT_MS);
  if(allTimer) stars++;
  const isPast = dateStr < ymd(new Date());
  if(isPast) return {stars, allDone:true, settled:true, pending:false};
  return {stars:0, allDone:true, settled:false, pending:true};  // 今日全做完，次日结算
}

function renderList(){

  let html="";

  const doneReal = ts.filter(t=>t.done && !t.makeup).length;     // 当日完成数量（真实完成、非补打卡）
  const doneMakeup = ts.filter(t=>t.done && t.makeup).length;    // 补打卡完成数量
  const pendingCorr = ts.filter(t=>(t.wrong||0)>0 && !t.corrected).length;  // 待订正：有错题且未确认订正
  const pendingDone = ts.filter(t=>!t.done).length;              // 待完成：尚未完成
  html += `<div class="top-stats">
    <div class="ts-cell"><div class="ts-v g">${doneReal}<small>项</small></div><div class="ts-k">当日完成</div></div>
    <div class="ts-cell"><div class="ts-v g">${doneMakeup}<small>项</small></div><div class="ts-k">补打卡</div></div>
    <div class="ts-cell"><div class="ts-v warn">${pendingCorr}<small>项</small></div><div class="ts-k">待订正</div></div>

  const doneEst = Math.round(ts.filter(t=>t.done && isTimed(t)).reduce((a,t)=>a+recMs(t),0)/60000);
  const remainEst = ts.filter(t=>!t.done).reduce((a,t)=>a+(t.estMin||0),0);
  // 未计时 = 当天无任何实际记录（真实计时 < 1 分钟）的作业项数，与「已做时长=实际」口径一致

  SUBJECTS.forEach(subj=>{

    if(all.length===0){
      html += `<div class="empty-tip" style="padding:16px 0;">今日暂无${subj}作业</div>`;
    } else {
      pending.forEach(t=>{ html += todoRow(t); });
      // 已完成项沉到本卡片底部，而非全局统一沉底（仅留紧凑分隔线，不显示文字）
      if(done.length){

      添加作业
    </div>
    <div class="seg4" id="seg4">`;
  SUBJECTS.forEach((s,i)=> html += `<button class="${s===addSubj?'on':''}" data-s="${s}" onclick="pickAddSubj(this)">${s}</button>`);
  html += `</div>
    <div class="add-row"><input id="addInput" placeholder="输入作业内容…" /><input id="addEst" class="add-est" type="number" min="0" inputmode="numeric" placeholder="预估分" /><button class="plus" onclick="doAdd()">+</button></div>

  $("listContent").innerHTML = html;

function todoRow(t){
  const open = openExpo===t.id;
  const running = t.timerRunning;
  const locked = makeupLocked(t);     // 逾期锁定：未完成且距作业日已超过锁定天数 → 不可补打卡
  const delLocked = deleteLocked(t);  // 删除锁定：作业日超过 DELETE_LOCK_DAYS 天后禁止删除具体条目
  const meta = [];
  if(locked) meta.push(`<span style="color:var(--muted)">逾期 · 不可补打卡</span>`);
  if(running) meta.push(`<span class="pulse"></span><span style="color:var(--sun);font-weight:700;" data-timer="${t.id}">● 计时中 ${fmtDur(spentOf(t))}</span>`);
  if(t.done && !running) meta.push(`<span style="color:var(--green);font-weight:600;">✓ 已完成</span>`);
  if(t.estMin) meta.push(`预估 ${t.estMin} 分`);

          <button class="tbtn pause ${!running?'dis':''}" ${!running?'disabled':''} onclick="timerPause('${t.id}')"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>暂停</button>

      </div>
    </div>`;
  return `<div class="todo" id="todo-${t.id}">
    ${ t.done?'<span class="stamp" id="stamp-'+t.id+'">已完成</span>':'' }

        ${ meta.length?`<div class="todo-meta">${meta.join("")}</div>`:"" }
      </div>
      <div class="todo-acts">
        <span class="acts-edit">
          <button class="mini-btn lock ${t.lock==='daily'?'on':''}" title="每日固定（单击切换固定/取消）" onclick="event.stopPropagation();toggleLock('${t.id}','daily')">日</button>
          <button class="mini-btn lock week ${t.lock==='weekly'?'on':''}" title="每周固定（单击切换固定/取消）" onclick="event.stopPropagation();toggleLock('${t.id}','weekly')">周</button>

          <button class="mini-btn del ${delLocked?'dis':''}" title="${delLocked?'已超过'+DELETE_LOCK_DAYS+'天，不可删除（仍可编辑状态/补打卡/改错题/订正）':'删除'}" ${delLocked?'disabled':''} onclick="event.stopPropagation();delTodo('${t.id}')">${trashSvg()}</button>

}
/* 订正完成确认：仅当该作业存在错题（wrong>0）时才有意义；切换 corrected 标记 */
function toggleCorrected(id){
  const t=getTodo(id); if(!t) return;
  if(!(t.wrong>0)){ return; }                 // 无错题无需订正
  t.corrected = !t.corrected;
  touch(t); save(); renderList(); syncDerived();
  toast(t.corrected ? "已确认：错题已订正完成" : "已取消订正确认");
}
function editField(id,key,val){
  const t=getTodo(id); if(!t) return;
  if(key==="estMin"||key==="wrong"){ t[key]=Math.max(0,parseInt(val||"0",10)||0); if(key==="wrong" && t.wrong===0) t.corrected=false; }  // 错题清零 → 订正标记失效
  else { t[key]=val; }
  // 循环作业：把 标题/内容/预估 同步回母版与同组未开始实例
  if(t.masterId && (key==="title"||key==="detail"||key==="estMin")){
    const m=getMaster(t.masterId);
    if(m){ if(key==="estMin") m.estMin=t.estMin; else m[key]=t[key]; m._u=Date.now(); propagateMaster(m, t.date); }
  }
  touch(t); save(); syncDerived();
}
/* 手动记录实际用时（忘按计时器时填）：manualMin>0 时覆盖计时器真实值；填 0 或不填则回到计时器值 */

}
